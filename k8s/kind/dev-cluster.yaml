# Kind cluster configuration for Aura development
# Optimized for local testing and development
#
# Usage:
#   kind create cluster --config=dev-cluster.yaml
#   kubectl cluster-info --context kind-aura-dev

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aura-dev
networking:
  disableDefaultCNI: false
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/audit.log
            audit-log-maxage: "7"
            audit-log-maxbackup: "3"
            audit-log-maxsize: "100"
    extraPortMappings:
      # Aura P2P (NodePort 30656)
      - containerPort: 30656
        hostPort: 30656
        protocol: TCP
      # Aura RPC (NodePort 30657)
      - containerPort: 30657
        hostPort: 30657
        protocol: TCP
      # Aura API (NodePort 30317)
      - containerPort: 30317
        hostPort: 30317
        protocol: TCP
      # Aura gRPC (NodePort 30090)
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      # Prometheus (NodePort 30009)
      - containerPort: 30009
        hostPort: 30009
        protocol: TCP
      # AlertManager (NodePort 30093)
      - containerPort: 30093
        hostPort: 30093
        protocol: TCP
      # Grafana (NodePort 30030)
      - containerPort: 30030
        hostPort: 30030
        protocol: TCP
      # Ingress HTTP
      - containerPort: 80
        hostPort: 10080
        protocol: TCP
      # Ingress HTTPS
      - containerPort: 443
        hostPort: 10443
        protocol: TCP
    extraMounts:
      - hostPath: /tmp/aura-data/validators
        containerPath: /data/aura-validators
      - hostPath: /tmp/aura-data/nodes
        containerPath: /data/aura-nodes
      - hostPath: /tmp/aura-data/monitoring
        containerPath: /data/aura-monitoring
      - hostPath: /tmp/aura-data/audit
        containerPath: /var/log/kubernetes

  - role: worker
    extraMounts:
      - hostPath: /tmp/aura-data/validators
        containerPath: /data/aura-validators
      - hostPath: /tmp/aura-data/nodes
        containerPath: /data/aura-nodes

  - role: worker
    extraMounts:
      - hostPath: /tmp/aura-data/validators
        containerPath: /data/aura-validators
      - hostPath: /tmp/aura-data/nodes
        containerPath: /data/aura-nodes

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5050"]
      endpoint = ["http://aura-registry:5000"]
