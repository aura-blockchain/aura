apiVersion: batch/v1
kind: CronJob
metadata:
  name: aura-backup
  namespace: aura
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: aura-validator
          containers:
            - name: backup
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  kubectl exec aura-validator-0 -- \
                    tar czf - /home/aura/.aura/data | \
                    gzip > /backup/aura-$(date +%Y%m%d-%H%M%S).tar.gz
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: aura-backups
          restartPolicy: OnFailure
