apiVersion: v1
kind: Service
metadata:
  name: aura-node-p2p
  labels:
    app: aura
    component: node
spec:
  type: NodePort
  selector:
    app: aura
    component: node
  ports:
    - port: 26656
      targetPort: 26656
      protocol: TCP
      name: p2p
---
apiVersion: v1
kind: Service
metadata:
  name: aura-node-rpc
  labels:
    app: aura
    component: node
spec:
  type: ClusterIP
  selector:
    app: aura
    component: node
  ports:
    - port: 26657
      targetPort: 26657
      protocol: TCP
      name: rpc
---
apiVersion: v1
kind: Service
metadata:
  name: aura-node-api
  labels:
    app: aura
    component: node
spec:
  type: ClusterIP
  selector:
    app: aura
    component: node
  ports:
    - port: 1317
      targetPort: 1317
      protocol: TCP
      name: api
---
apiVersion: v1
kind: Service
metadata:
  name: aura-node-grpc
  labels:
    app: aura
    component: node
spec:
  type: ClusterIP
  selector:
    app: aura
    component: node
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: aura-node-metrics
  labels:
    app: aura
    component: node
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "26660"
spec:
  type: ClusterIP
  selector:
    app: aura
    component: node
  ports:
    - port: 26660
      targetPort: 26660
      protocol: TCP
      name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: aura-validator
  labels:
    app: aura
    component: validator
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: aura
    component: validator
  ports:
    - port: 26656
      targetPort: 26656
      protocol: TCP
      name: p2p
    - port: 26657
      targetPort: 26657
      protocol: TCP
      name: rpc
