# External Secrets configuration for HashiCorp Vault integration
# Provides secure secret management for production deployments
#
# Prerequisites:
# 1. Install External Secrets Operator: helm install external-secrets external-secrets/external-secrets
# 2. Configure Vault with Kubernetes auth: vault auth enable kubernetes
# 3. Create Vault policies for aura secrets
#
# Vault path structure:
#   secret/data/aura/validator-keys - Validator private keys
#   secret/data/aura/api-keys       - API authentication keys
#   secret/data/aura/genesis        - Genesis configuration

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: aura
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "aura-validator"
          serviceAccountRef:
            name: "aura-validator"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aura-validator-keys
  namespace: aura
  labels:
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: validator
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: aura-validator-keys
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        priv_validator_key.json: "{{ .priv_validator_key | toString }}"
        node_key.json: "{{ .node_key | toString }}"
  data:
  - secretKey: priv_validator_key
    remoteRef:
      key: secret/data/aura/validator-keys
      property: priv_validator_key
  - secretKey: node_key
    remoteRef:
      key: secret/data/aura/validator-keys
      property: node_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aura-api-secrets
  namespace: aura
  labels:
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: api
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: aura-api-secrets
    creationPolicy: Owner
  data:
  - secretKey: jwt_secret
    remoteRef:
      key: secret/data/aura/api-keys
      property: jwt_secret
  - secretKey: api_key
    remoteRef:
      key: secret/data/aura/api-keys
      property: api_key
---
# ClusterSecretStore for cross-namespace access (if needed)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-store
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "aura-cluster"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
