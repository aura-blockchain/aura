# Service accounts for Aura blockchain components
# Each component gets a dedicated SA with least-privilege RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-validator
  namespace: aura
  labels:
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: validator
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-sentry
  namespace: aura
  labels:
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: sentry
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-rpc
  namespace: aura
  labels:
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: rpc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-api
  namespace: aura
  labels:
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
# Role for validators to read their own config
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aura-validator-role
  namespace: aura
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["aura-config", "aura-genesis"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["aura-validator-keys"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aura-validator-binding
  namespace: aura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aura-validator-role
subjects:
- kind: ServiceAccount
  name: aura-validator
  namespace: aura
---
# Role for RPC nodes to read config only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aura-rpc-role
  namespace: aura
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["aura-config", "aura-genesis"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aura-rpc-binding
  namespace: aura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aura-rpc-role
subjects:
- kind: ServiceAccount
  name: aura-rpc
  namespace: aura
