apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-node
  labels:
    app: aura
    component: node
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-validator
  labels:
    app: aura
    component: validator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aura-node-role
  labels:
    app: aura
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aura-node-rolebinding
  labels:
    app: aura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aura-node-role
subjects:
  - kind: ServiceAccount
    name: aura-node
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aura-validator-role
  labels:
    app: aura
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aura-validator-rolebinding
  labels:
    app: aura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aura-validator-role
subjects:
  - kind: ServiceAccount
    name: aura-validator
    namespace: default
