apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-node
  labels:
    app: aura
    component: node
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aura
      component: node
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aura
        component: node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "26660"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aura-node
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true

      initContainers:
      - name: init-config
        image: aequitas/aura:latest
        command: ['sh', '-c']
        args:
          - |
            if [ ! -f /home/aura/.aura/config/config.toml ]; then
              aurad init $(POD_NAME) --chain-id $(CHAIN_ID)
              cp /config/genesis.json /home/aura/.aura/config/genesis.json
              cp /config/config.toml /home/aura/.aura/config/config.toml
              cp /config/app.toml /home/aura/.aura/config/app.toml
            fi
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: CHAIN_ID
            value: "aura-mvp-1"
        volumeMounts:
          - name: aura-data
            mountPath: /home/aura/.aura
          - name: config
            mountPath: /config

      containers:
      - name: aura
        image: aequitas/aura:latest
        imagePullPolicy: Always
        command: ["aurad", "start"]
        ports:
          - name: p2p
            containerPort: 26656
            protocol: TCP
          - name: rpc
            containerPort: 26657
            protocol: TCP
          - name: api
            containerPort: 1317
            protocol: TCP
          - name: grpc
            containerPort: 9090
            protocol: TCP
          - name: metrics
            containerPort: 26660
            protocol: TCP

        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: MINIMUM_GAS_PRICES
            value: "0.025uaura"

        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
          limits:
            memory: "16Gi"
            cpu: "8000m"

        livenessProbe:
          httpGet:
            path: /health
            port: 26657
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - |
                aurad status 2>&1 | grep -q '"catching_up":false'
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 26657
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 30

        volumeMounts:
          - name: aura-data
            mountPath: /home/aura/.aura
          - name: config
            mountPath: /home/aura/.aura/config
            subPath: config

      volumes:
        - name: config
          configMap:
            name: aura-config
        - name: aura-data
          persistentVolumeClaim:
            claimName: aura-data

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - aura
                topologyKey: kubernetes.io/hostname

      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 300
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 300
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aura-validator
  labels:
    app: aura
    component: validator
spec:
  serviceName: aura-validator
  replicas: 1
  selector:
    matchLabels:
      app: aura
      component: validator
  template:
    metadata:
      labels:
        app: aura
        component: validator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "26660"
    spec:
      serviceAccountName: aura-validator
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true

      containers:
      - name: aura
        image: aequitas/aura:latest
        imagePullPolicy: Always
        command: ["aurad", "start"]
        ports:
          - name: p2p
            containerPort: 26656
          - name: rpc
            containerPort: 26657
          - name: metrics
            containerPort: 26660

        env:
          - name: VALIDATOR_KEY
            valueFrom:
              secretKeyRef:
                name: validator-keys
                key: priv_validator_key.json

        resources:
          requests:
            memory: "16Gi"
            cpu: "8000m"
          limits:
            memory: "32Gi"
            cpu: "16000m"

        volumeMounts:
          - name: aura-data
            mountPath: /home/aura/.aura
          - name: validator-keys
            mountPath: /home/aura/.aura/config/priv_validator_key.json
            subPath: priv_validator_key.json
            readOnly: true

      volumes:
        - name: validator-keys
          secret:
            secretName: validator-keys
            defaultMode: 0400

  volumeClaimTemplates:
    - metadata:
        name: aura-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 500Gi
