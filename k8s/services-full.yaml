---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: aura-validator-headless
  namespace: aura
  labels:
    app: aura
    component: validator
spec:
  clusterIP: None
  selector:
    app: aura
    component: validator
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
    - name: rpc
      port: 26657
      targetPort: 26657
    - name: api
      port: 1317
      targetPort: 1317
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: metrics
      port: 26660
      targetPort: 26660
  publishNotReadyAddresses: true

---
# P2P LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: aura-p2p
  namespace: aura
  labels:
    app: aura
    component: p2p
spec:
  type: NodePort
  selector:
    app: aura
    component: validator
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
      nodePort: 30656
  sessionAffinity: ClientIP

---
# RPC Service
apiVersion: v1
kind: Service
metadata:
  name: aura-rpc
  namespace: aura
  labels:
    app: aura
    component: rpc
spec:
  type: ClusterIP
  selector:
    app: aura
    component: validator
  ports:
    - name: rpc
      port: 26657
      targetPort: 26657

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: aura-api
  namespace: aura
  labels:
    app: aura
    component: api
spec:
  type: ClusterIP
  selector:
    app: aura
    component: validator
  ports:
    - name: api
      port: 1317
      targetPort: 1317

---
# gRPC Service
apiVersion: v1
kind: Service
metadata:
  name: aura-grpc
  namespace: aura
  labels:
    app: aura
    component: grpc
spec:
  type: ClusterIP
  selector:
    app: aura
    component: validator
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090

---
# Metrics Service
apiVersion: v1
kind: Service
metadata:
  name: aura-metrics
  namespace: aura
  labels:
    app: aura
    component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "26660"
spec:
  type: ClusterIP
  selector:
    app: aura
    component: validator
  ports:
    - name: metrics
      port: 26660
      targetPort: 26660
