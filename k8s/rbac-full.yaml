---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-validator
  namespace: aura

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aura-node
  namespace: aura

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aura-role
  namespace: aura
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - configmaps
      - secrets
      - services
      - endpoints
      - persistentvolumeclaims
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - statefulsets/status
      - deployments
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aura-rolebinding
  namespace: aura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aura-role
subjects:
  - kind: ServiceAccount
    name: aura-validator
    namespace: aura
  - kind: ServiceAccount
    name: aura-node
    namespace: aura

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aura-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - persistentvolumes
      - events
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: [get, list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aura-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aura-cluster-role
subjects:
  - kind: ServiceAccount
    name: aura-validator
    namespace: aura
