apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aura-blockchain
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:aura-blockchain/aura.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: aura
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
