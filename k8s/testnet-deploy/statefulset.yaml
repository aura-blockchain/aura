apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aura-validator
  namespace: aura
  labels:
    app: aura
    app.kubernetes.io/name: aura
    app.kubernetes.io/component: validator
spec:
  serviceName: aura-validator-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: aura
      app.kubernetes.io/component: validator
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: aura
        app.kubernetes.io/name: aura
        app.kubernetes.io/component: validator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "26660"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aura-validator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [aura]
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: init-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/config /data/data
              echo "Initializing data directories..."
              # Create minimal genesis if not exists
              if [ ! -f /data/config/genesis.json ]; then
                cat > /data/config/genesis.json << 'EOF'
              {
                "genesis_time": "2024-01-01T00:00:00.000000000Z",
                "chain_id": "aura-mvp-1",
                "initial_height": "1",
                "consensus_params": {
                  "block": {"max_bytes": "22020096", "max_gas": "-1"},
                  "evidence": {"max_age_num_blocks": "100000", "max_age_duration": "172800000000000"},
                  "validator": {"pub_key_types": ["ed25519"]},
                  "version": {"app": "0"}
                },
                "app_hash": "",
                "app_state": {}
              }
              EOF
              fi
              echo "Init complete"
          volumeMounts:
            - name: aura-data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        # Mock blockchain node for k8s infrastructure testing
        # Replace with actual aurad image for production
        - name: aura
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              # Create mock endpoints that simulate a Cosmos SDK node
              mkdir -p /tmp/nginx/run /tmp/nginx/logs /tmp/nginx/cache/client_temp /tmp/nginx/cache/proxy_temp /tmp/nginx/cache/fastcgi_temp /tmp/nginx/cache/uwsgi_temp /tmp/nginx/cache/scgi_temp
              cat > /tmp/nginx.conf << 'NGINX'
              pid /tmp/nginx/run/nginx.pid;
              error_log /tmp/nginx/logs/error.log;
              events { worker_connections 1024; }
              http {
                # Cache directories for non-root
                client_body_temp_path /tmp/nginx/cache/client_temp;
                proxy_temp_path /tmp/nginx/cache/proxy_temp;
                fastcgi_temp_path /tmp/nginx/cache/fastcgi_temp;
                uwsgi_temp_path /tmp/nginx/cache/uwsgi_temp;
                scgi_temp_path /tmp/nginx/cache/scgi_temp;
                access_log /tmp/nginx/logs/access.log;

                # Mock RPC responses
                server {
                  listen 26657;

                  location /health {
                    return 200 '{"status":"OK"}';
                    add_header Content-Type application/json;
                  }

                  location /status {
                    return 200 '{"jsonrpc":"2.0","id":-1,"result":{"node_info":{"network":"aura-mvp-1","moniker":"aura-validator"},"sync_info":{"latest_block_height":"1000","latest_block_time":"2024-01-01T00:00:00Z","catching_up":false},"validator_info":{"address":"TESTADDR001","voting_power":"100"}}}';
                    add_header Content-Type application/json;
                  }

                  location /validators {
                    return 200 '{"jsonrpc":"2.0","id":-1,"result":{"block_height":"1000","validators":[{"address":"TESTADDR001","voting_power":"100"},{"address":"TESTADDR002","voting_power":"100"},{"address":"TESTADDR003","voting_power":"100"}],"count":"3","total":"3"}}';
                    add_header Content-Type application/json;
                  }

                  location /net_info {
                    return 200 '{"jsonrpc":"2.0","id":-1,"result":{"listening":true,"listeners":["Listener(@)"],"n_peers":"2","peers":[]}}';
                    add_header Content-Type application/json;
                  }

                  location / {
                    return 200 '{"jsonrpc":"2.0","id":-1,"result":{}}';
                    add_header Content-Type application/json;
                  }
                }

                # Mock REST API
                server {
                  listen 1317;

                  location /health {
                    return 200 '{"status":"OK"}';
                    add_header Content-Type application/json;
                  }

                  location /cosmos/base/tendermint/v1beta1/node_info {
                    return 200 '{"default_node_info":{"network":"aura-mvp-1","moniker":"aura-validator"},"application_version":{"name":"aura","version":"1.0.0"}}';
                    add_header Content-Type application/json;
                  }

                  location / {
                    return 200 '{}';
                    add_header Content-Type application/json;
                  }
                }

                # Mock gRPC-gateway
                server {
                  listen 9090;
                  location / {
                    return 200 'gRPC endpoint';
                  }
                }

                # Prometheus metrics
                server {
                  listen 26660;
                  location /metrics {
                    return 200 '# HELP tendermint_consensus_height Current consensus height
              # TYPE tendermint_consensus_height gauge
              tendermint_consensus_height 1000
              # HELP tendermint_consensus_validators Number of validators
              # TYPE tendermint_consensus_validators gauge
              tendermint_consensus_validators 3
              # HELP tendermint_consensus_missing_validators Number of missing validators
              # TYPE tendermint_consensus_missing_validators gauge
              tendermint_consensus_missing_validators 0
              ';
                    add_header Content-Type text/plain;
                  }
                }
              }
              NGINX
              nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - name: p2p
              containerPort: 26656
              protocol: TCP
            - name: rpc
              containerPort: 26657
              protocol: TCP
            - name: api
              containerPort: 1317
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 26660
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: aura-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: aura-config
        - name: genesis
          configMap:
            name: aura-genesis
        - name: validator-keys
          secret:
            secretName: aura-validator-keys
            defaultMode: 0400

      terminationGracePeriodSeconds: 30

  volumeClaimTemplates:
    - metadata:
        name: aura-data
        labels:
          app: aura
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
