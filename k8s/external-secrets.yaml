apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: vault

---
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: vault
type: Opaque
stringData:
  token: "<set-by-ops>"  # Populate out-of-band with a non-root token that has aura-read

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aura-secrets
  namespace: aura
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: aura-secrets-from-vault
    creationPolicy: Owner
    template:
      data:
        priv_validator_key-aura-validator-0.json: "{{ .priv_validator_key_0 }}"
        node_key-aura-validator-0.json: "{{ .node_key_0 }}"
        priv_validator_key-aura-validator-1.json: "{{ .priv_validator_key_1 }}"
        node_key-aura-validator-1.json: "{{ .node_key_1 }}"
        priv_validator_key-aura-validator-2.json: "{{ .priv_validator_key_2 }}"
        node_key-aura-validator-2.json: "{{ .node_key_2 }}"
        priv_validator_key-aura-validator-3.json: "{{ .priv_validator_key_3 }}"
        node_key-aura-validator-3.json: "{{ .node_key_3 }}"
        jwt-secret.txt: "{{ .jwt_secret }}"
  data:
    - secretKey: priv_validator_key_0
      remoteRef:
        key: aura/validator-keys
        property: priv_validator_key_val0
    - secretKey: node_key_0
      remoteRef:
        key: aura/validator-keys
        property: node_key_val0
    - secretKey: priv_validator_key_1
      remoteRef:
        key: aura/validator-keys
        property: priv_validator_key_val1
    - secretKey: node_key_1
      remoteRef:
        key: aura/validator-keys
        property: node_key_val1
    - secretKey: priv_validator_key_2
      remoteRef:
        key: aura/validator-keys
        property: priv_validator_key_val2
    - secretKey: node_key_2
      remoteRef:
        key: aura/validator-keys
        property: node_key_val2
    - secretKey: priv_validator_key_3
      remoteRef:
        key: aura/validator-keys
        property: priv_validator_key_val3
    - secretKey: node_key_3
      remoteRef:
        key: aura/validator-keys
        property: node_key_val3
    - secretKey: jwt_secret
      remoteRef:
        key: aura/validator-keys
        property: jwt_secret
