version: '3.8'

services:
  aura-counter:
    image: aurad:latest
    container_name: aura-counter
    hostname: aura-counter
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 6g
    ports:
      - "29656:26656"
      - "29657:26657"
      - "2322:1317"
      - "12092:9090"
      - "29660:26660"
    volumes:
      - ./testnet-data/aura-counter:/home/aura/.aura
    environment:
      - CHAIN_ID=aura-counter-1
      - MONIKER=aura-counter
      - LOG_LEVEL=info
      - MINIMUM_GAS_PRICES=0.025stake
      - ENABLE_UNSAFE_CORS=true
    networks:
      - aura-counter-net
    healthcheck:
      test: ["CMD", "aurad", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "aura.role=ibc-counterparty"
      - "aura.network=aura-counter-1"

networks:
  aura-counter-net:
    driver: bridge
