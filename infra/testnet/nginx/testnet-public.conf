# Aura Testnet Public Endpoints (RPC/API/Faucet/Explorer/Status)

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=faucet_limit:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream services
upstream aura_rpc {
    least_conn;
    server 127.0.0.1:26657;
    keepalive 32;
}

upstream aura_api {
    server 127.0.0.1:1317;
    keepalive 32;
}

upstream aura_faucet {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream aura_explorer_frontend {
    server 127.0.0.1:8088;
    keepalive 16;
}

upstream aura_explorer_api {
    server 127.0.0.1:8082;
    keepalive 16;
}

upstream aura_explorer_ws {
    server 127.0.0.1:8083;
    keepalive 8;
}

upstream aura_graphql {
    server 127.0.0.1:4000;
    keepalive 8;
}

upstream aura_archive {
    # Archive node RPC - will proxy to SERVICES (10.10.0.4:26757) when available
    server 127.0.0.1:26757;
    keepalive 32;
}

upstream aura_grpc {
    server 127.0.0.1:9090;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name
        testnet-rpc.aurablockchain.org
        testnet-api.aurablockchain.org
        testnet-faucet.aurablockchain.org
        testnet-explorer.aurablockchain.org
        testnet-status.aurablockchain.org
        testnet-graphql.aurablockchain.org
        testnet-docs.aurablockchain.org
        testnet-ws.aurablockchain.org
        testnet-archive.aurablockchain.org
        testnet-grpc.aurablockchain.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# RPC endpoint
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet-rpc.aurablockchain.org;

    ssl_certificate /etc/letsencrypt/live/testnet-rpc.aurablockchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet-rpc.aurablockchain.org/privkey.pem;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time,Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range,X-Chain-Id,X-Block-Height" always;

    location / {
        limit_req zone=rpc_limit burst=20 nodelay;
        proxy_pass http://aura_rpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# REST API endpoint
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet-api.aurablockchain.org;

    ssl_certificate /etc/letsencrypt/live/testnet-api.aurablockchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet-api.aurablockchain.org/privkey.pem;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time,Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range,X-Chain-Id,X-Block-Height" always;

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://aura_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# gRPC endpoint (TLS passthrough)

