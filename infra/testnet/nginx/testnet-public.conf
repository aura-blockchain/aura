# Explorer UI + API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet-explorer.aurablockchain.org;

    ssl_certificate /etc/letsencrypt/live/testnet-explorer.aurablockchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet-explorer.aurablockchain.org/privkey.pem;

    location /rpc {
        limit_req zone=rpc_limit burst=20 nodelay;
        rewrite ^/rpc/?(.*)$ /$1 break;
        proxy_pass http://aura_rpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://aura_explorer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://aura_explorer_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://aura_explorer_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

