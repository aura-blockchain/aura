# gRPC endpoint (HTTP/2 required)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet-grpc.aurablockchain.org;

    ssl_certificate /etc/letsencrypt/live/testnet-grpc.aurablockchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet-grpc.aurablockchain.org/privkey.pem;

    location / {
        grpc_pass grpc://aura_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;

        # gRPC timeouts
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
