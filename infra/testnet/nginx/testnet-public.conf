# Status page
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet-status.aurablockchain.org;

    ssl_certificate /etc/letsencrypt/live/testnet-status.aurablockchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet-status.aurablockchain.org/privkey.pem;

    root /var/www/aura-status;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /genesis.json {
        try_files $uri =404;
    }

    location = /seed-nodes.json {
        try_files $uri =404;
    }

    location = /chain-registry.json {
        try_files $uri =404;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        alias /var/www/aura-status/swagger/;
        try_files $uri $uri/ /swagger/index.html;
    }
}

