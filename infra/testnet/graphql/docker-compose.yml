version: '3.8'

services:
  graphql:
    build: .
    container_name: aura-graphql
    environment:
      RPC_URL: http://host.docker.internal:26657
      API_URL: http://host.docker.internal:1317
      PORT: 4000
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
