# Prometheus configuration for Aura testnet monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aura-testnet'
    monitor: 'aura-monitoring'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cometbft'
    static_configs:
      - targets: ['host.docker.internal:26660']

  - job_name: 'cosmos-sdk'
    static_configs:
      - targets: ['host.docker.internal:26661']
