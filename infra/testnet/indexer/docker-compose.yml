version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aura-indexer-db
    environment:
      POSTGRES_DB: aura_indexer
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura-indexer-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: ../../explorer
      dockerfile: Dockerfile.production
    container_name: aura-indexer
    command: python indexer.py
    environment:
      DATABASE_URL: postgresql://indexer:${DB_PASSWORD:-change_me}@postgres:5432/aura_indexer
      NODE_RPC_URL: ${NODE_RPC_URL:-http://host.docker.internal:26657}
      NODE_API_URL: ${NODE_API_URL:-http://host.docker.internal:1317}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
