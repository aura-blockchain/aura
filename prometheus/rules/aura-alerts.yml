groups:
  - name: aura-blockchain
    rules:
      # Chain halt detection
      - alert: ChainHalted
        expr: increase(cometbft_consensus_height[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AURA blockchain has halted"
          description: "No new blocks have been produced in the last 5 minutes"

      # Block time too high
      - alert: SlowBlockTime
        expr: cometbft_consensus_block_interval_seconds > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Block time is too high"
          description: "Block time is {{ $value }}s (threshold: 10s)"

      # Low peer count
      - alert: LowPeerCount
        expr: cometbft_p2p_peers < 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low peer count"
          description: "Node has only {{ $value }} peers (minimum: 3)"

      # Validator not signing
      - alert: ValidatorNotSigning
        expr: cometbft_consensus_validator_power == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Validator is not signing blocks"
          description: "Validator voting power is 0"

  - name: system-resources
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"

      # Disk space running low
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}% (threshold: 80%)"

  - name: wasm-module
    rules:
      # WASM transaction failure rate
      - alert: WASMTransactionFailureRate
        expr: (rate(aura_wasm_tx_failures_total[5m]) / clamp_min(rate(aura_wasm_tx_total[5m]), 0.0001)) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WASM transaction failure rate exceeds 1%"
          description: "WASM tx failure rate is {{ $value | humanizePercentage }} (threshold: 1%). Contract: {{ $labels.contract_address }}, Error: {{ $labels.error_type }}"
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasmtransactionfailurerate"

      # WASM signature mismatch
      - alert: WASMSignatureMismatch
        expr: rate(aura_bridge_signature_mismatches_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WASM signature verification mismatches detected"
          description: "Signature mismatch rate: {{ $value | humanize }}/sec. Chain: {{ $labels.chain }}, Type: {{ $labels.signature_type }}, Reason: {{ $labels.error_reason }}"
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#signaturemismatchratehigh"

      # WASM contract deployment failure
      - alert: WASMContractDeploymentFailure
        expr: increase(aura_wasm_instantiation_failures_total[10m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WASM contract deployment failures detected"
          description: "{{ $value }} contract instantiation failures in last 10 minutes. Code ID: {{ $labels.code_id }}, Error: {{ $labels.error_type }}"
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasminstantiationfailures"

      # WASM execution timeout
      - alert: WASMExecutionTimeout
        expr: histogram_quantile(0.95, rate(aura_wasm_execution_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WASM contract execution is timing out"
          description: "95th percentile execution time is {{ $value }}s (threshold: 5s). Contract: {{ $labels.contract_address }}. Consider optimizing contract code or increasing gas limits."
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasm-execution-performance"

      # WASM gas exhaustion
      - alert: WASMGasExhaustion
        expr: rate(aura_wasm_tx_failures_total{error_type="out_of_gas"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of WASM gas exhaustion errors"
          description: "Out-of-gas errors: {{ $value | humanize }}/sec. Contract: {{ $labels.contract_address }}. Users may need higher gas limits or contract code needs optimization."
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasmoutofgasspike"

  - name: consensus-health
    rules:
      # Consensus stuck - no height increase
      - alert: ConsensusStuck
        expr: rate(cometbft_consensus_height[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consensus is stuck - no new blocks"
          description: "Validator {{ $labels.validator }} has not increased height in the last 5 minutes. Current height: {{ $value }}"

      # High consensus rounds - indicates voting issues
      - alert: HighConsensusRounds
        expr: cometbft_consensus_round > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High consensus rounds detected"
          description: "Validator {{ $labels.validator }} is in round {{ $value }} for current height. This indicates voting issues or network problems."

      # Consensus round stuck
      - alert: ConsensusRoundStuck
        expr: changes(cometbft_consensus_round[5m]) == 0 and cometbft_consensus_round > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consensus round is stuck"
          description: "Validator {{ $labels.validator }} has been in the same round for 5 minutes. Round: {{ $value }}"

      # Low prevote participation
      - alert: LowPrevoteParticipation
        expr: (cometbft_consensus_prevotes_voting_power / 3600000) < 0.67
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low prevote participation in consensus"
          description: "Validator {{ $labels.validator }} round {{ $labels.round }} has only {{ $value | humanizePercentage }} prevote voting power (threshold: 67%)"

      # Low precommit participation
      - alert: LowPrecommitParticipation
        expr: (cometbft_consensus_precommits_voting_power / 3600000) < 0.67
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Low precommit participation in consensus"
          description: "Validator {{ $labels.validator }} round {{ $labels.round }} has only {{ $value | humanizePercentage }} precommit voting power (threshold: 67%)"

      # No block proposal received
      - alert: NoBlockProposal
        expr: cometbft_consensus_has_proposal == 0 and cometbft_consensus_step >= 2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "No block proposal received"
          description: "Validator {{ $labels.validator }} has not received a block proposal despite being in step {{ $value }}"

      # Low block production rate
      - alert: LowBlockProductionRate
        expr: cometbft_consensus_height_rate < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low block production rate"
          description: "Validator {{ $labels.validator }} is producing blocks at {{ $value }} blocks/minute (expected: ~6 blocks/minute for 10s block time)"

      # Validator participation drop
      - alert: ValidatorParticipationDrop
        expr: cometbft_consensus_validator_participation < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Validator participation has dropped"
          description: "Validator {{ $labels.validator_address }} on node {{ $labels.validator }} has {{ $value | humanizePercentage }} participation (threshold: 90%)"

      # Frequent consensus timeouts
      - alert: FrequentConsensusTimeouts
        expr: rate(cometbft_consensus_timeouts_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Frequent consensus timeouts"
          description: "Validator {{ $labels.validator }} is experiencing {{ $value | humanize }}/sec {{ $labels.timeout_type }} timeouts"

      # Long consensus rounds
      - alert: LongConsensusRounds
        expr: histogram_quantile(0.95, rate(cometbft_consensus_round_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consensus rounds taking too long"
          description: "Validator {{ $labels.validator }} has 95th percentile round duration of {{ $value }}s (threshold: 30s)"

      # Missing prevotes from majority
      - alert: MissingPrevotesFromMajority
        expr: cometbft_consensus_prevotes_received < 3 and cometbft_consensus_step >= 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Not receiving prevotes from majority of validators"
          description: "Validator {{ $labels.validator }} has only received {{ $value }} prevotes in round {{ $labels.round }} (need at least 3 for 4-validator testnet)"

      # Missing precommits from majority
      - alert: MissingPrecommitsFromMajority
        expr: cometbft_consensus_precommits_received < 3 and cometbft_consensus_step >= 5
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Not receiving precommits from majority of validators"
          description: "Validator {{ $labels.validator }} has only received {{ $value }} precommits in round {{ $labels.round }} (need at least 3 for 4-validator testnet)"

  - name: panic-recovery
    rules:
      # Panic recovery monitoring - added 2026-01-20 after panic recovery implementation
      # All 20 custom modules now have panic recovery in BeginBlock/EndBlock handlers

      - alert: ModulePanicRecovered
        expr: rate(aura_module_panic_recovered_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Module panic recovered in {{ $labels.module }}"
          description: "Module {{ $labels.module }} recovered from a panic in {{ $labels.handler }}. This indicates a bug that needs investigation. Stack trace available in logs."

      - alert: FrequentModulePanics
        expr: increase(aura_module_panic_recovered_total[1h]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frequent panics in module {{ $labels.module }}"
          description: "Module {{ $labels.module }} has had {{ $value }} panics in the last hour. Immediate investigation required."

      - alert: MultipleModulesPanicking
        expr: count(increase(aura_module_panic_recovered_total[1h]) > 0) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Multiple modules experiencing panics"
          description: "{{ $value }} different modules have panicked in the last hour. This may indicate a systemic issue."

      # Cosmovisor monitoring - added 2026-01-20 after Cosmovisor setup
      - alert: CosmovisorUpgradePending
        expr: cosmovisor_upgrade_pending == 1
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Cosmovisor upgrade pending"
          description: "An upgrade is scheduled. Cosmovisor will automatically switch binaries at the upgrade height."

      - alert: CosmovisorUpgradeFailed
        expr: cosmovisor_upgrade_failed == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cosmovisor upgrade failed"
          description: "The automatic upgrade failed. Manual intervention required. Check Cosmovisor logs."
