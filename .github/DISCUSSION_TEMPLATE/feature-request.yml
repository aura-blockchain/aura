title: "[Feature] "
labels:
  - feature-request
  - community
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for Aura! Please fill out the form below.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Brief description of the proposed feature
      placeholder: What would you like to see added to Aura?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
      placeholder: Explain the use case and benefits
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How do you envision this feature working?
      placeholder: Describe your proposed implementation (optional)
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Related Module
      description: Which module does this feature relate to?
      options:
        - Core (auth, bank, staking)
        - Identity (identity, vcregistry, credentials)
        - Privacy (confidential, compliance, zkp)
        - DeFi (dex, economics, bridge)
        - Governance
        - Other / Multiple
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing discussions and issues for duplicates
          required: true
