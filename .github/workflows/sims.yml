name: Blockchain Simulations

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      simulation_type:
        description: 'Type of simulation to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - determinism
          - import-export
          - after-import
          - multi-seed

permissions:
  contents: read

jobs:
  setup:
    name: Setup Simulation Environment
    runs-on: ubuntu-latest
    outputs:
      run_determinism: ${{ steps.check.outputs.determinism }}
      run_import_export: ${{ steps.check.outputs.import_export }}
      run_after_import: ${{ steps.check.outputs.after_import }}
      run_multi_seed: ${{ steps.check.outputs.multi_seed }}
    steps:
      - name: Determine simulations to run
        id: check
        run: |
          TYPE="${{ github.event.inputs.simulation_type || 'all' }}"
          if [ "$TYPE" = "all" ] || [ "$TYPE" = "determinism" ]; then
            echo "determinism=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TYPE" = "all" ] || [ "$TYPE" = "import-export" ]; then
            echo "import_export=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TYPE" = "all" ] || [ "$TYPE" = "after-import" ]; then
            echo "after_import=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TYPE" = "all" ] || [ "$TYPE" = "multi-seed" ]; then
            echo "multi_seed=true" >> $GITHUB_OUTPUT
          fi

  sim-determinism:
    name: Simulation - Determinism
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run_determinism == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: chain/go.sum

      - name: Run determinism simulation
        working-directory: chain
        run: |
          go test -mod=readonly -run TestAppStateDeterminism -timeout 60m \
            -v ./app/... 2>&1 | tee sim-determinism.log

      - name: Upload simulation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-determinism-logs
          path: chain/sim-determinism.log
          retention-days: 30

  sim-import-export:
    name: Simulation - Import/Export
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run_import_export == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: chain/go.sum

      - name: Run import/export simulation
        working-directory: chain
        run: |
          go test -mod=readonly -run TestAppImportExport -timeout 120m \
            -NumBlocks=200 -BlockSize=50 -Commit=true -v ./app/... 2>&1 | tee sim-import-export.log

      - name: Upload simulation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-import-export-logs
          path: chain/sim-import-export.log
          retention-days: 30

  sim-after-import:
    name: Simulation - After Import
    runs-on: ubuntu-latest
    needs: [setup, sim-import-export]
    if: needs.setup.outputs.run_after_import == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: chain/go.sum

      - name: Run after-import simulation
        working-directory: chain
        run: |
          go test -mod=readonly -run TestAppSimulationAfterImport -timeout 60m \
            -NumBlocks=100 -BlockSize=25 -Commit=true -v ./app/... 2>&1 | tee sim-after-import.log

      - name: Upload simulation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-after-import-logs
          path: chain/sim-after-import.log
          retention-days: 30

  sim-multi-seed:
    name: Simulation - Multi-Seed
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run_multi_seed == 'true'
    timeout-minutes: 180
    strategy:
      matrix:
        seed: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: chain/go.sum

      - name: Run multi-seed simulation (seed ${{ matrix.seed }})
        working-directory: chain
        run: |
          go test -mod=readonly -run TestFullAppSimulation -timeout 180m \
            -Seed=${{ matrix.seed }} -NumBlocks=500 -BlockSize=100 \
            -Commit=true -v ./app/... 2>&1 | tee sim-seed-${{ matrix.seed }}.log

      - name: Upload simulation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-seed-${{ matrix.seed }}-logs
          path: chain/sim-seed-${{ matrix.seed }}.log
          retention-days: 30

  summary:
    name: Simulation Summary
    runs-on: ubuntu-latest
    needs: [sim-determinism, sim-import-export, sim-after-import, sim-multi-seed]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Blockchain Simulation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Simulation | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Determinism | ${{ needs.sim-determinism.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import/Export | ${{ needs.sim-import-export.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| After Import | ${{ needs.sim-after-import.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-Seed | ${{ needs.sim-multi-seed.result }} |" >> $GITHUB_STEP_SUMMARY
