name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet

permissions:
  contents: read
  security-events: write
  actions: read

# =============================================================================
# IMPORTANT: Configuration values are sourced from aura-ansible repository
# Do NOT hardcode chain-specific values here. They are defined in:
#   aura-ansible/group_vars/chain.yml (single source of truth)
# =============================================================================

env:
  GO_VERSION: '1.23'
  BINARY_NAME: aurad
  ANSIBLE_REPO: 'aura-blockchain/ansible'
  ANSIBLE_BRANCH: 'main'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      binary_sha: ${{ steps.build.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: chain/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-deploy-${{ hashFiles('chain/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-deploy-
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: chain
        run: go mod download

      - name: Verify dependencies
        working-directory: chain
        run: go mod verify

      - name: Build binary
        id: build
        working-directory: chain
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -v -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" \
            -o build/${{ env.BINARY_NAME }} ./cmd/aurad

          # Verify binary was created
          ls -lh build/${{ env.BINARY_NAME }}
          file build/${{ env.BINARY_NAME }}

          # Output checksum for verification
          SHA=$(sha256sum build/${{ env.BINARY_NAME }} | cut -d' ' -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Binary SHA256: $SHA"

      - name: Test binary execution
        working-directory: chain
        run: |
          ./build/${{ env.BINARY_NAME }} version

      - name: Run tests
        working-directory: chain
        run: |
          go test ./... -short -race -coverprofile=coverage.out -timeout=10m

      - name: Generate test summary
        working-directory: chain
        if: always()
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-amd64
          path: chain/build/${{ env.BINARY_NAME }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: chain/coverage.out
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: chain/go.sum

      - name: Run Go vulnerability check
        working-directory: chain
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Security scan summary
        if: always()
        run: |
          echo "### Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks: Checked for hardcoded secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Govulncheck: Checked for known vulnerabilities" >> $GITHUB_STEP_SUMMARY

  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: testnet
      url: https://testnet-rpc.aurablockchain.org
    concurrency:
      group: deploy-testnet
      cancel-in-progress: false
    steps:
      - name: Checkout aura-ansible repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANSIBLE_REPO }}
          ref: ${{ env.ANSIBLE_BRANCH }}
          path: ansible
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}

      - name: Download binary artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-amd64
          path: ./build

      - name: Make binary executable
        run: chmod +x ./build/${{ env.BINARY_NAME }}

      - name: Verify binary
        run: |
          ./build/${{ env.BINARY_NAME }} version
          echo "Binary checksum: $(sha256sum ./build/${{ env.BINARY_NAME }})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible==8.7.0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TESTNET_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TESTNET_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Validate Ansible configuration
        working-directory: ansible
        run: |
          # Validate configuration is consistent
          if [[ -f scripts/validate-config.sh ]]; then
            ./scripts/validate-config.sh || echo "::warning::Configuration validation found issues"
          fi

          # Verify inventory syntax
          ansible-inventory -i inventory/testnet.yml --list > /dev/null
          echo "Inventory validation passed"

      - name: Run Ansible deployment
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_STDOUT_CALLBACK: yaml
          BINARY_PATH: ${{ github.workspace }}/build/${{ env.BINARY_NAME }}
        run: |
          # Use the existing update-binaries playbook from ansible repo
          ansible-playbook \
            -i inventory/testnet.yml \
            playbooks/update-binaries.yml \
            -e "binary_path=${BINARY_PATH}" \
            -e "binary_name=${{ env.BINARY_NAME }}" \
            -v

      - name: Verify deployment health
        working-directory: ansible
        run: |
          # Run health check playbook if available
          if [[ -f playbooks/health-check.yml ]]; then
            ansible-playbook \
              -i inventory/testnet.yml \
              playbooks/health-check.yml \
              -v || echo "::warning::Health check reported issues"
          fi

          # Extract chain_id from chain.yml for summary
          CHAIN_ID=$(grep "^chain_id:" group_vars/chain.yml | awk '{print $2}' | tr -d '"')

          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Binary: ${{ env.BINARY_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Chain ID: ${CHAIN_ID}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Binary SHA256: ${{ needs.build-and-test.outputs.binary_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed at: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -rf ~/.ssh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to testnet failed. Manual intervention may be required."
          echo "Check the Ansible output above for details."
