name: Security Scanning

# This workflow performs security scanning of Docker images and codebase
# using Trivy vulnerability scanner

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'chain/Dockerfile*'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'chain/Dockerfile*'
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan-dockerfiles:
    name: Scan Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - path: 'Dockerfile'
            image: 'aura-node'
          - path: 'Dockerfile.secure'
            image: 'aura-node-secure'
          - path: 'Dockerfile.local'
            image: 'aura-node-local'
          - path: 'chain/Dockerfile'
            image: 'aura-chain'
          - path: 'chain/Dockerfile.simple'
            image: 'aura-chain-simple'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if Dockerfile exists
        id: check-file
        run: |
          if [ -f "${{ matrix.dockerfile.path }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Dockerfile ${{ matrix.dockerfile.path }} not found, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check-file.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check-file.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile.path }}
          push: false
          load: true
          tags: ${{ matrix.dockerfile.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        if: steps.check-file.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.dockerfile.image }}:test
          format: 'sarif'
          output: 'trivy-results-${{ matrix.dockerfile.image }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: steps.check-file.outputs.exists == 'true' && always()
        with:
          sarif_file: 'trivy-results-${{ matrix.dockerfile.image }}.sarif'
          category: 'trivy-${{ matrix.dockerfile.image }}'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        if: steps.check-file.outputs.exists == 'true' && always()
        with:
          image-ref: ${{ matrix.dockerfile.image }}:test
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
        continue-on-error: true

  scan-filesystem:
    name: Scan Filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

      - name: Run Trivy filesystem scanner (table output)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  scan-config:
    name: Scan Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

      - name: Run Trivy config scanner (table output)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [scan-dockerfiles, scan-filesystem, scan-config]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scanning completed. Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scanned Components" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images (aura-node, aura-node-secure, aura-node-local, aura-chain, aura-chain-simple)" >> $GITHUB_STEP_SUMMARY
          echo "- Filesystem and dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration files (Dockerfiles, Kubernetes, Terraform, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile Scanning: ${{ needs.scan-dockerfiles.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Filesystem Scanning: ${{ needs.scan-filesystem.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Config Scanning: ${{ needs.scan-config.result }}" >> $GITHUB_STEP_SUMMARY
