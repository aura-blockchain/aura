name: Chain Upgrade Testing

on:
  pull_request:
    paths:
      - 'chain/app/upgrades/**'
      - 'chain/app/app.go'
  workflow_dispatch:
    inputs:
      from_version:
        description: 'Version to upgrade from'
        required: true
        default: 'v1.0.0'
      to_version:
        description: 'Version to upgrade to'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  upgrade-test:
    name: Test Chain Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout target version
        uses: actions/checkout@v4
        with:
          path: new-version

      - name: Checkout base version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.from_version || github.event.pull_request.base.sha }}
          path: old-version

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Build old binary
        working-directory: old-version/chain
        run: |
          go build -o /tmp/aurad-old ./cmd/aurad
          /tmp/aurad-old version

      - name: Build new binary
        working-directory: new-version/chain
        run: |
          go build -o /tmp/aurad-new ./cmd/aurad
          /tmp/aurad-new version

      - name: Initialize chain with old version
        run: |
          /tmp/aurad-old init test-node --chain-id aura-upgrade-test --home /tmp/aura-home

          # Add genesis accounts
          /tmp/aurad-old keys add validator --keyring-backend test --home /tmp/aura-home
          /tmp/aurad-old genesis add-genesis-account validator 1000000000uaura \
            --keyring-backend test --home /tmp/aura-home
          /tmp/aurad-old genesis gentx validator 100000000uaura \
            --chain-id aura-upgrade-test --keyring-backend test --home /tmp/aura-home
          /tmp/aurad-old genesis collect-gentxs --home /tmp/aura-home

      - name: Start old chain and produce blocks
        run: |
          /tmp/aurad-old start --home /tmp/aura-home &
          sleep 30

          # Verify chain is producing blocks
          curl -s http://localhost:26657/status | jq '.result.sync_info.latest_block_height'

          # Stop chain gracefully
          pkill aurad-old || true
          sleep 5

      - name: Simulate upgrade with new binary
        run: |
          # Start with new binary (simulates upgrade)
          /tmp/aurad-new start --home /tmp/aura-home &
          sleep 30

          # Verify chain continues
          HEIGHT=$(curl -s http://localhost:26657/status | jq -r '.result.sync_info.latest_block_height')
          echo "Chain height after upgrade: $HEIGHT"

          if [ "$HEIGHT" -lt "10" ]; then
            echo "Chain failed to continue after upgrade"
            exit 1
          fi

          pkill aurad-new || true

      - name: Cleanup
        if: always()
        run: |
          pkill aurad || true
          rm -rf /tmp/aura-home
