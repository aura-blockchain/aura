name: Community Automation

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, labeled, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label-issues:
    name: Auto-Label Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label based on content
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const labels = [];

            // Bug detection
            if (title.includes('bug') || title.includes('error') || title.includes('crash')) {
              labels.push('bug');
            }

            // Feature request
            if (title.includes('feature') || title.includes('request') || title.includes('enhancement')) {
              labels.push('enhancement');
            }

            // Documentation
            if (title.includes('doc') || title.includes('readme')) {
              labels.push('documentation');
            }

            // Module detection
            if (body.includes('x/credential') || title.includes('credential')) {
              labels.push('module:credential');
            }
            if (body.includes('x/identity') || title.includes('identity')) {
              labels.push('module:identity');
            }

            // Priority based on keywords
            if (title.includes('urgent') || title.includes('critical')) {
              labels.push('priority:high');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

  welcome-contributor:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Check if first contribution
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const creator = context.payload.pull_request.user.login;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: creator
            });
            return prs.length === 1;

      - name: Welcome message
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `Welcome @${pr.user.login}! Thank you for your first contribution to AURA.

            A maintainer will review your PR shortly. In the meantime:
            - Make sure all CI checks pass
            - Ensure your commits are signed off (DCO)
            - Check our [CONTRIBUTING.md](../CONTRIBUTING.md) guide

            If you have questions, feel free to ask here or join our [Discord](https://discord.gg/aura).`
            });

  add-to-project:
    name: Add to Project Board
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/aura-blockchain/projects/1
          github-token: ${{ secrets.PROJECT_PAT }}
