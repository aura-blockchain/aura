name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gosec:
    name: gosec - Cosmos Security Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['chain', 'faucet/backend', 'faucet-service/backend', 'sdk/go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # Use Cosmos SDK's gosec fork with Cosmos-specific security rules
      # See: https://github.com/cosmos/gosec
      - name: Run Cosmos Gosec Security Scanner
        uses: cosmos/gosec@master
        with:
          # G104: redundant with errcheck linter in golangci-lint
          # G204: test utilities legitimately use exec (annotate production code)
          # G702: incorrectly flags crypto/rand as blocklisted
          # Exclude non-production directories
          args: -exclude=G104,G204,G702 -exclude-dir=tests -exclude-dir=testutil -exclude-dir=archive -fmt=json -out=${{ matrix.module }}/gosec-results.json ./${{ matrix.module }}/...
        continue-on-error: true

      - name: Check for high/medium severity issues
        id: severity-check
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f gosec-results.json ]; then
            # Count HIGH and MEDIUM severity issues (fail CI on these)
            HIGH_MED_COUNT=$(jq '[.Issues[] | select(.severity == "HIGH" or .severity == "MEDIUM")] | length' gosec-results.json 2>/dev/null || echo "0")
            LOW_COUNT=$(jq '[.Issues[] | select(.severity == "LOW")] | length' gosec-results.json 2>/dev/null || echo "0")

            echo "High/Medium severity issues: $HIGH_MED_COUNT"
            echo "Low severity issues (warnings only): $LOW_COUNT"
            echo "high_med_count=$HIGH_MED_COUNT" >> $GITHUB_OUTPUT

            if [ "$HIGH_MED_COUNT" -gt 0 ]; then
              echo "::error::Found $HIGH_MED_COUNT high/medium severity security issues in ${{ matrix.module }}"
              echo "### High/Medium Severity Issues:" >> $GITHUB_STEP_SUMMARY
              jq -r '.Issues[] | select(.severity == "HIGH" or .severity == "MEDIUM") | "- [\(.severity)] \(.rule_id): \(.details) in \(.file):\(.line)"' gosec-results.json >> $GITHUB_STEP_SUMMARY
            fi

            if [ "$LOW_COUNT" -gt 0 ]; then
              echo "::warning::Found $LOW_COUNT low severity issues (warnings only)"
            fi
          fi

      - name: Generate SARIF report
        working-directory: ${{ matrix.module }}
        if: always()
        run: |
          # Install standard gosec for SARIF output (cosmos/gosec action doesn't support SARIF)
          curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.21.4
          gosec -exclude=G104,G204,G702 -exclude-dir=tests -exclude-dir=testutil -exclude-dir=archive -fmt=sarif -out=gosec-results.sarif ./... || true

      - name: Upload gosec SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ matrix.module }}/gosec-results.sarif
          category: gosec-${{ matrix.module }}

      - name: Generate human-readable report
        working-directory: ${{ matrix.module }}
        if: always()
        run: |
          if [ -f gosec-results.json ]; then
            # Convert JSON to readable text format
            echo "=== AURA Security Scan Report ===" > gosec-report.txt
            echo "Module: ${{ matrix.module }}" >> gosec-report.txt
            echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> gosec-report.txt
            echo "" >> gosec-report.txt
            jq -r '.Issues[] | "[\(.severity)] \(.rule_id): \(.details)\n  File: \(.file):\(.line)\n  Code: \(.code)\n"' gosec-results.json >> gosec-report.txt 2>/dev/null || echo "No issues found" >> gosec-report.txt
          fi

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-gosec-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/gosec-results.sarif
            ${{ matrix.module }}/gosec-results.json
            ${{ matrix.module }}/gosec-report.txt
          retention-days: 90

      - name: Fail on high/medium severity issues
        if: steps.severity-check.outputs.high_med_count > 0
        run: |
          echo "Failing CI due to ${{ steps.severity-check.outputs.high_med_count }} high/medium severity security issues"
          exit 1

  govulncheck:
    name: govulncheck - Vulnerability Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['chain', 'faucet/backend', 'faucet-service/backend', 'sdk/go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          govulncheck -json ./... > govulncheck-results.json || true
          govulncheck ./... > govulncheck-report.txt || true

      - name: Check for critical vulnerabilities
        working-directory: ${{ matrix.module }}
        run: |
          if grep -q '"severity": "HIGH"' govulncheck-results.json || grep -q '"severity": "CRITICAL"' govulncheck-results.json; then
            echo "::warning::High or critical vulnerabilities found in ${{ matrix.module }}"
            cat govulncheck-report.txt
          fi

      - name: Upload vulnerability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-govulncheck-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/govulncheck-results.json
            ${{ matrix.module }}/govulncheck-report.txt
          retention-days: 90

  nancy:
    name: nancy - Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['chain', 'faucet/backend', 'faucet-service/backend', 'sdk/go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install nancy
        run: |
          curl -L -o nancy https://github.com/sonatype-nexus-community/nancy/releases/latest/download/nancy-linux-amd64
          chmod +x nancy
          sudo mv nancy /usr/local/bin/

      - name: Run nancy dependency scan
        working-directory: ${{ matrix.module }}
        run: |
          go list -json -deps ./... | nancy sleuth > nancy-report.txt || true
          cat nancy-report.txt

      - name: Upload nancy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-nancy-${{ matrix.module }}
          path: ${{ matrix.module }}/nancy-report.txt
          retention-days: 90

  staticcheck:
    name: staticcheck - Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['chain', 'faucet/backend', 'faucet-service/backend', 'sdk/go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        working-directory: ${{ matrix.module }}
        run: |
          staticcheck -f json ./... > staticcheck-results.json || true
          staticcheck ./... > staticcheck-report.txt || true

      - name: Upload staticcheck artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-staticcheck-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/staticcheck-results.json
            ${{ matrix.module }}/staticcheck-report.txt
          retention-days: 90

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  trivy:
    name: Trivy - Container & Filesystem Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

      - name: Run Trivy for human-readable report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-trivy
          path: |
            trivy-results.sarif
            trivy-report.txt
          retention-days: 90

  security-report:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [gosec, govulncheck, nancy, staticcheck, codeql, trivy]
    if: always()
    steps:
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: security-*
          merge-multiple: true

      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Job Status" >> security-summary.md
          echo "- gosec: ${{ needs.gosec.result }}" >> security-summary.md
          echo "- govulncheck: ${{ needs.govulncheck.result }}" >> security-summary.md
          echo "- nancy: ${{ needs.nancy.result }}" >> security-summary.md
          echo "- staticcheck: ${{ needs.staticcheck.result }}" >> security-summary.md
          echo "- codeql: ${{ needs.codeql.result }}" >> security-summary.md
          echo "- trivy: ${{ needs.trivy.result }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "See individual job artifacts for detailed reports." >> security-summary.md
          cat security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

      - name: Comment security summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
