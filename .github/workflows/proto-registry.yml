name: Protobuf Registry

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Proto Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: '1.47.2'

      - name: Lint
        working-directory: proto
        run: buf lint

  breaking:
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: '1.47.2'

      - name: Check breaking changes
        working-directory: proto
        run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'

  push-to-bsr:
    name: Push to Buf Schema Registry
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: '1.47.2'

      - name: Push to BSR
        working-directory: proto
        run: buf push
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  generate-docs:
    name: Generate Proto Documentation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: '1.47.2'

      - name: Generate docs
        working-directory: proto
        run: |
          buf generate --template buf.gen.yaml

      - name: Upload proto docs
        uses: actions/upload-artifact@v4
        with:
          name: proto-docs
          path: proto/docs/
          retention-days: 30
