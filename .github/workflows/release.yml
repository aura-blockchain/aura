name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Build Release Binaries
  # ============================================================================
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        working-directory: chain
        run: |
          go build \
            -mod=readonly \
            -tags "netgo,ledger" \
            -ldflags="-w -s \
            -X github.com/cosmos/cosmos-sdk/version.Name=aura \
            -X github.com/cosmos/cosmos-sdk/version.AppName=aurad \
            -X github.com/cosmos/cosmos-sdk/version.Version=${{ steps.version.outputs.version }} \
            -X github.com/cosmos/cosmos-sdk/version.Commit=${{ github.sha }} \
            -X github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger" \
            -trimpath \
            -o ../build/aurad-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/aurad/main.go

      - name: Create tarball (Unix)
        if: matrix.goos != 'windows'
        working-directory: build
        run: |
          tar -czf aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.tar.gz \
            aurad-${{ matrix.suffix }}

      - name: Create zip (Windows)
        if: matrix.goos == 'windows'
        working-directory: build
        run: |
          zip aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip \
            aurad-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Generate checksums
        working-directory: build
        run: |
          if [ -f aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.tar.gz ]; then
            sha256sum aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.tar.gz > \
              aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.tar.gz.sha256
          fi
          if [ -f aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip ]; then
            sha256sum aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip > \
              aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurad-${{ matrix.suffix }}
          path: |
            build/aurad-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.*
          retention-days: 5

  # ============================================================================
  # Build and Push Docker Images
  # ============================================================================
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Consolidate artifacts
        run: |
          mkdir -p ./release
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) \
            -exec cp {} ./release/ \;

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Aura Blockchain ${{ steps.version.outputs.version }}

          ### What's New

          This release includes the latest improvements and bug fixes for the Aura blockchain.

          ### Docker Images

          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ```

          ### Installation

          #### Linux / macOS

          ```bash
          # Download and extract
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/aurad-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
          tar -xzf aurad-${{ steps.version.outputs.version }}-linux-amd64.tar.gz

          # Verify checksum
          sha256sum -c aurad-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256

          # Install
          sudo mv aurad-linux-amd64 /usr/local/bin/aurad
          sudo chmod +x /usr/local/bin/aurad

          # Verify installation
          aurad version
          ```

          #### Windows

          Download the Windows binary and verify the checksum:

          ```powershell
          # Verify installation
          .\aurad-windows-amd64.exe version
          ```

          ### Checksums

          All release artifacts include SHA-256 checksums for verification.

          ### Build Information

          - **Version**: ${{ steps.version.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Go Version**: ${{ env.GO_VERSION }}
          - **Build Date**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ### Supported Platforms

          - Linux (amd64, arm64)
          - macOS (amd64, arm64)
          - Windows (amd64)

          ---

          For more information, see the [documentation](https://github.com/${{ github.repository }}/blob/main/README.md).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ./release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Post-Release Notifications
  # ============================================================================
  notify:
    name: Post-Release Notifications
    needs: [create-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release completed successfully!" >> $GITHUB_STEP_SUMMARY
