name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v1.61'
  BUF_VERSION: '1.28.1'

jobs:
  # ============================================================================
  # Validation & Linting
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: chain
          args: --timeout=10m

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint protobuf files
        working-directory: proto
        run: buf lint

      - name: Check formatting
        working-directory: proto
        run: buf format --diff --exit-code

  # ============================================================================
  # Build & Compile
  # ============================================================================
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go modules
        run: |
          cd chain && go mod verify
          cd ../proto && go mod verify

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: make build

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        working-directory: chain
        run: go build -o ../build/aurad.exe ./cmd/aurad/main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurad-${{ matrix.os }}
          path: |
            build/aurad*
          retention-days: 7

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']
        test-suite:
          - 'x/auth/...'
          - 'x/bridge/...'
          - 'x/compliance/...'
          - 'x/confidencescore/...'
          - 'x/cryptography/...'
          - 'x/dataregistry/...'
          - 'x/dex/...'
          - 'x/economicsecurity/...'
          - 'x/governance/...'
          - 'x/identitychange/...'
          - 'x/inclusionroutines/...'
          - 'x/monitoring/...'
          - 'x/networksecurity/...'
          - 'x/prevalidation/...'
          - 'x/privacy/...'
          - 'x/validatorsecurity/...'
          - 'x/vcregistry/...'
          - 'x/walletsecurity/...'
          - 'x/aiassistant/...'
          - 'x/contractregistry/...'
          - 'x/wasm/...'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run unit tests for ${{ matrix.test-suite }}
        working-directory: chain
        run: go test -short -v -race -timeout=30m ./${{ matrix.test-suite }}

      - name: Run keeper tests
        working-directory: chain
        run: go test -v -run TestKeeper ./${{ matrix.test-suite }}

      - name: Run msg server tests
        working-directory: chain
        run: go test -v -run TestMsgServer ./${{ matrix.test-suite }}

      - name: Run query server tests
        working-directory: chain
        run: go test -v -run TestQueryServer ./${{ matrix.test-suite }}

      - name: Run genesis tests
        working-directory: chain
        run: go test -v -run TestGenesis ./${{ matrix.test-suite }}

      - name: Run invariant tests
        working-directory: chain
        run: go test -v -run TestInvariant ./${{ matrix.test-suite }}

  # ============================================================================
  # Integration Tests
  # ============================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        working-directory: chain
        run: go test -tags=integration -v -timeout=45m ./testing/integration/...

      - name: Run module interaction tests
        working-directory: chain
        run: go test -v -run TestModuleInteraction ./testing/integration/...

      - name: Run upgrade path tests
        working-directory: chain
        run: go test -v -run TestUpgrade ./testing/integration/...

      - name: Run security integration tests
        working-directory: chain
        run: go test -v -run TestSecurity ./testing/integration/...

  # ============================================================================
  # Stress & Performance Tests
  # ============================================================================
  test-stress:
    name: Stress & Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run stress tests
        working-directory: chain
        run: go test -v -timeout=30m ./testing/stress/...

      - name: Run benchmark tests
        working-directory: chain
        run: go test -bench=. -benchmem -benchtime=10s ./testing/benchmark/... | tee benchmark-results.txt

      - name: Run load tests
        working-directory: chain
        run: go test -v -run TestLoad ./testing/stress/...

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          tool: 'go'
          output-file-path: chain/benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: chain/benchmark-results.txt
          retention-days: 90

  # ============================================================================
  # Fuzz Tests
  # ============================================================================
  test-fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run fuzz tests
        working-directory: chain
        run: |
          go test -fuzz=FuzzMessageValidation -fuzztime=60s ./testing/fuzz/...
          go test -fuzz=FuzzAddressValidation -fuzztime=60s ./testing/fuzz/...
          go test -fuzz=FuzzAmountValidation -fuzztime=60s ./testing/fuzz/...

  # ============================================================================
  # E2E Tests
  # ============================================================================
  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run E2E tests
        working-directory: chain
        run: go test -v -timeout=60m ./testing/e2e/...

  # ============================================================================
  # Code Coverage
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        working-directory: chain
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./chain/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage report
        working-directory: chain
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: chain/coverage.html
          retention-days: 30

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd chain && govulncheck ./...

      - name: Run gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd chain && gosec -fmt=sarif -out=gosec-results.sarif ./... || true

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          cd chain && staticcheck ./...

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'chain/gosec-results.sarif'

      - name: Dependency vulnerability check
        run: |
          cd chain
          go list -json -m all | go run golang.org/x/vuln/cmd/govulncheck@latest -mode=convert -

      - name: License compliance check
        run: |
          go install github.com/google/go-licenses@latest
          cd chain && go-licenses check ./...

  # ============================================================================
  # Docker Build
  # ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aura/node:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aura/node:ci-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Proto Generation Check
  # ============================================================================
  proto-check:
    name: Protobuf Generation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate protobuf files
        working-directory: proto
        run: buf generate

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Protobuf files are out of sync. Run 'make proto-gen' and commit the changes." && exit 1)

  # ============================================================================
  # Module Verification
  # ============================================================================
  mod-verify:
    name: Go Module Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go modules
        run: |
          cd chain && go mod verify && go mod tidy && git diff --exit-code go.mod go.sum
          cd ../proto && go mod verify && go mod tidy && git diff --exit-code go.mod go.sum

  # ============================================================================
  # Status Check
  # ============================================================================
  ci-success:
    name: CI Success
    if: always()
    needs:
      - lint
      - build
      - test-unit
      - test-integration
      - test-stress
      - test-fuzz
      - test-e2e
      - coverage
      - security
      - docker
      - proto-check
      - mod-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"

      - name: Post success notification
        if: success()
        run: echo "✅ All ${{ github.workflow }} checks passed!"
