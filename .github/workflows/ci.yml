name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    name: Go + PHP checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl

      - name: Install Composer dependencies
        run: |
          php tools/bin/composer.phar install --no-progress --prefer-dist

      - name: Run Go tests
        run: go test ./...

      - name: Run PHPCS
        run: php tools/bin/composer.phar run phpcs

      - name: Run PHPStan
        run: php tools/bin/composer.phar run phpstan

      - name: Run PHPUnit
        run: php tools/bin/composer.phar run phpunit
