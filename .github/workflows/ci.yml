name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    name: Go + PHP checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl

      - name: Download Composer
        run: |
          mkdir -p tools/bin
          curl -sS https://getcomposer.org/installer | php -- --install-dir=tools/bin --filename=composer.phar
          chmod +x tools/bin/composer.phar

      - name: Install Composer dependencies
        run: |
          php tools/bin/composer.phar install --no-progress --prefer-dist

      - name: Build Go modules
        run: |
          cd chain && go build ./...
          cd ../proto && go build ./...

      - name: Run Go tests
        run: |
          cd chain && go test ./... -v
          cd ../proto && go test ./... -v

      - name: Run PHPCS
        run: php tools/bin/composer.phar run phpcs

      - name: Run PHPStan
        run: php tools/bin/composer.phar run phpstan

      - name: Run PHPUnit
        run: php tools/bin/composer.phar run phpunit
