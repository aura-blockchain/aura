name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['chain', 'faucet/backend', 'faucet-service/backend', 'sdk/go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.module }}-
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0

      - name: Run golangci-lint
        working-directory: ${{ matrix.module }}
        run: |
          golangci-lint run --timeout=10m --out-format=colored-line-number

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Verify go mod tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['chain', 'faucet/backend', 'faucet-service/backend', 'sdk/go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-test-${{ matrix.module }}-
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Run tests with race detection
        working-directory: ${{ matrix.module }}
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic -timeout=20m -v

      - name: Generate coverage report
        working-directory: ${{ matrix.module }}
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          name: coverage-${{ matrix.module }}
          fail_ci_if_error: false

      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/coverage.out
            ${{ matrix.module }}/coverage.html
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ matrix.arch }}-${{ hashFiles('chain/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.arch }}-
            ${{ runner.os }}-go-build-

      - name: Build aurad binary
        working-directory: chain
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -v -o aurad-${{ matrix.os }}-${{ matrix.arch }} ./cmd/aurad
          file aurad-${{ matrix.os }}-${{ matrix.arch }}
          ls -lh aurad-${{ matrix.os }}-${{ matrix.arch }}

      - name: Test binary execution (amd64 only)
        if: matrix.arch == 'amd64'
        working-directory: chain
        run: |
          ./aurad-${{ matrix.os }}-${{ matrix.arch }} version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurad-${{ matrix.os }}-${{ matrix.arch }}
          path: chain/aurad-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  proto-verify:
    name: Verify Proto Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install buf
        run: |
          BUF_VERSION=1.47.2
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Lint proto files
        working-directory: proto
        run: |
          if [ -f buf.yaml ]; then
            buf lint
          else
            echo "No buf.yaml found, skipping proto lint"
          fi

      - name: Breaking change detection
        working-directory: proto
        if: github.event_name == 'pull_request'
        run: |
          if [ -f buf.yaml ]; then
            buf breaking --against '.git#branch=main'
          else
            echo "No buf.yaml found, skipping breaking change detection"
          fi

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: aurad-linux-amd64
          path: chain/

      - name: Make binary executable
        run: chmod +x chain/aurad-linux-amd64

      - name: Run integration tests
        working-directory: chain
        run: |
          if [ -d "tests/integration" ]; then
            go test -v ./tests/integration/... -timeout=30m
          else
            echo "No integration tests found, skipping"
          fi

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, build, proto-verify]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.proto-verify.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
