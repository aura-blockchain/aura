name: Network Artifact Sync

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-peers:
    name: Sync Peer Information
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testnets repo
        uses: actions/checkout@v4
        with:
          repository: aura-blockchain/testnets
          token: ${{ secrets.TESTNETS_PAT }}
          path: testnets

      - name: Fetch live peer data
        run: |
          # Fetch from testnet RPC
          PEERS=$(curl -s https://testnet-rpc.aurablockchain.org/net_info | \
            jq -r '.result.peers[] | "\(.node_info.id)@\(.remote_ip):\(.node_info.listen_addr | split(":")[2])"' | \
            sort -u | head -20)

          echo "$PEERS" > testnets/aura-mvp-1/peers.txt

          # Generate persistent peers string
          PERSISTENT=$(echo "$PEERS" | tr '\n' ',' | sed 's/,$//')
          echo "persistent_peers = \"$PERSISTENT\"" > testnets/aura-mvp-1/persistent_peers.txt

      - name: Update state sync info
        run: |
          RPC="https://testnet-rpc.aurablockchain.org"
          LATEST=$(curl -s "$RPC/block" | jq -r '.result.block.header.height')
          TRUST_HEIGHT=$((LATEST - 2000))
          TRUST_HASH=$(curl -s "$RPC/block?height=$TRUST_HEIGHT" | jq -r '.result.block_id.hash')
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Write state sync config file (using printf to avoid YAML parser issues with heredoc)
          printf '%s\n' \
            "# State Sync Configuration" \
            "" \
            "Add to \`config.toml\`:" \
            "" \
            "\`\`\`toml" \
            "[statesync]" \
            "enable = true" \
            "rpc_servers = \"$RPC,$RPC\"" \
            "trust_height = $TRUST_HEIGHT" \
            "trust_hash = \"$TRUST_HASH\"" \
            "trust_period = \"168h\"" \
            "\`\`\`" \
            "" \
            "Last updated: $TIMESTAMP" \
            > testnets/aura-mvp-1/state_sync.md

      - name: Commit and push
        working-directory: testnets
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add .
          git commit -m "chore: auto-update network artifacts"
          git push

  upload-to-r2:
    name: Upload to Cloudflare R2
    runs-on: ubuntu-latest
    needs: sync-peers
    steps:
      - name: Checkout testnets
        uses: actions/checkout@v4
        with:
          repository: aura-blockchain/testnets
          path: testnets

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd testnets/aura-mvp-1

          wrangler r2 object put aura-testnet-artifacts/aura-mvp-1/peers.txt \
            --file peers.txt --content-type text/plain

          wrangler r2 object put aura-testnet-artifacts/aura-mvp-1/state-sync.md \
            --file state_sync.md --content-type text/markdown
