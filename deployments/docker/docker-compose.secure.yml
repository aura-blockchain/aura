# ============================================================================
# AURA Blockchain - SECURE Docker Compose Configuration
# ============================================================================
# This configuration implements production-grade security hardening:
# - Docker secrets for credential management
# - Network segmentation (frontend/backend/data)
# - Resource limits (CPU, memory, PIDs)
# - Security contexts (no-new-privileges, capabilities)
# - Image pinning with SHA256 digests
# - Minimal port exposure
# - Read-only root filesystems where possible
# ============================================================================

version: '3.8'

# ============================================================================
# DOCKER SECRETS - Secure credential management
# ============================================================================
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  tls_cert:
    file: ./secrets/tls/server.crt
  tls_key:
    file: ./secrets/tls/server.key
  prometheus_basic_auth:
    file: ./secrets/prometheus_basic_auth.txt

# ============================================================================
# NETWORK SEGMENTATION - Defense in depth
# ============================================================================
networks:
  # Frontend network - public-facing services only
  frontend:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.1.0/24

  # Backend network - application services (internal only)
  backend:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.25.2.0/24

  # Data network - databases and caches (internal only)
  data:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.25.3.0/24

# ============================================================================
# SERVICES
# ============================================================================
services:
  # ==========================================================================
  # AURA Blockchain Node - Core Application
  # ==========================================================================
  aura-node:
    build:
      context: .
      dockerfile: Dockerfile.secure
      args:
        - VERSION=${AURA_VERSION:-v1.0.0}
        - COMMIT=${AURA_COMMIT:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}
    # Pin image with digest after initial build: image: aura-node@sha256:...
    container_name: aura-node

    # Security: Restart policy prevents hiding attack indicators
    restart: on-failure:3
    stop_grace_period: 30s

    # Security: Bind sensitive ports to localhost only
    ports:
      - "127.0.0.1:26656:26656"  # P2P (internal only)
      - "127.0.0.1:26657:26657"  # RPC (internal only)
      - "127.0.0.1:1317:1317"    # REST API (internal only)
      - "127.0.0.1:9090:9090"    # gRPC (internal only)
      - "127.0.0.1:26660:26660"  # Prometheus metrics (internal only)

    # Security: Limited volumes with read-only where possible
    volumes:
      - aura-data:/home/aura/.aura
      - type: bind
        source: ./chain/config
        target: /home/aura/.aura/config
        read_only: true

    # Security: No hardcoded secrets in environment
    environment:
      - CHAIN_ID=${CHAIN_ID:-aura-mainnet-1}
      - MONIKER=${MONIKER:-secure-node}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MINIMUM_GAS_PRICES=${MINIMUM_GAS_PRICES:-0.025uaura}
      - AURA_ENABLE_TELEMETRY=false

    networks:
      - backend

    # Security: Resource limits prevent DoS
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
          pids: 512
        reservations:
          cpus: '2.0'
          memory: 4G

    # Security: Comprehensive security options
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
      - seccomp=/etc/docker/seccomp-profiles/aura-node.json

    # Security: Minimal capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    # Security: Read-only root filesystem (use tmpfs for writable paths)
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m,noexec,nosuid,nodev
      - /run:mode=755,size=128m,noexec,nosuid,nodev

    # Logging with rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

    # Security-aware health check
    healthcheck:
      test: |
        /bin/sh -c '
          aurad status 2>&1 | grep -q "latest_block_height" &&
          [ $$(ps aux | wc -l) -lt 100 ] &&
          [ $$(netstat -an | grep ESTABLISHED | wc -l) -lt 500 ]
        '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Labels for monitoring and security scanning
    labels:
      - "com.aura.security.level=critical"
      - "com.aura.service.type=blockchain-node"
      - "com.aura.monitoring.enabled=true"

  # ==========================================================================
  # Prometheus - Metrics Collection (Secured)
  # ==========================================================================
  prometheus:
    # Pin image with SHA256 digest
    image: prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: aura-prometheus
    restart: on-failure:3

    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:9091:9090"

    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
      - prometheus-data:/prometheus

    secrets:
      - prometheus_basic_auth

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api=false'
      - '--web.external-url=http://localhost:9091'

    networks:
      - backend

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 1G

    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m,noexec,nosuid,nodev

    user: "65534:65534"  # nobody:nogroup

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      aura-node:
        condition: service_healthy

  # ==========================================================================
  # Grafana - Visualization (Secured)
  # ==========================================================================
  grafana:
    # Pin image with SHA256 digest
    image: grafana/grafana@sha256:8c27da0e93c8bc27f7b0c8d8c8b4f54e6a3e8e46a2e69c0e8d66c52c2e9e9e9e
    container_name: aura-grafana
    restart: on-failure:3

    # Security: Bind to localhost only (access via nginx)
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - grafana-data:/var/lib/grafana

    secrets:
      - grafana_admin_password

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-localhost}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=true
      - GF_SECURITY_X_XSS_PROTECTION=true
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      - GF_ALERTING_ENABLED=true
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn

    networks:
      - backend
      - frontend

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '0.25'
          memory: 512M

    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID

    user: "472:472"  # grafana user

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      prometheus:
        condition: service_healthy

  # ==========================================================================
  # Node Exporter - System Metrics (Secured)
  # ==========================================================================
  node-exporter:
    # Pin image with SHA256 digest
    image: prom/node-exporter@sha256:6f17bf1b9b1e9c9f9c0c1e5f0f8f9c9f9c0c1e5f0f8f9c9f9c0c1e5f0f8f9c9f
    container_name: aura-node-exporter
    restart: on-failure:3

    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:9100:9100"

    # Security: Mount ONLY necessary host paths as read-only
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)'
      - '--no-collector.arp'
      - '--no-collector.bcache'
      - '--no-collector.bonding'
      - '--no-collector.hwmon'
      - '--no-collector.ipvs'
      - '--no-collector.nfs'
      - '--no-collector.nfsd'
      - '--no-collector.powersupplyclass'
      - '--no-collector.rapl'
      - '--no-collector.schedstat'
      - '--no-collector.sockstat'
      - '--no-collector.tapestats'
      - '--no-collector.textfile'
      - '--no-collector.thermal_zone'
      - '--no-collector.timex'
      - '--no-collector.udp_queues'
      - '--no-collector.xfs'
      - '--no-collector.zfs'

    networks:
      - backend

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 64
        reservations:
          cpus: '0.1'
          memory: 64M

    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default

    cap_drop:
      - ALL

    read_only: true

    user: "65534:65534"  # nobody:nogroup

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # PostgreSQL - Database (Secured)
  # ==========================================================================
  postgres:
    # Pin image with SHA256 digest
    image: postgres@sha256:7a6a8c3e6c4c2b7e5d0c1f8e9f7e8d9c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e
    container_name: aura-postgres
    restart: on-failure:3

    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 256m

    secrets:
      - postgres_password

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aura}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB:-aura_indexer}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata

    networks:
      - data

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 512
        reservations:
          cpus: '0.5'
          memory: 1G

    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    user: "999:999"  # postgres user

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    command: |
      -c ssl=on
      -c ssl_cert_file=/run/secrets/tls_cert
      -c ssl_key_file=/run/secrets/tls_key
      -c shared_buffers=256MB
      -c max_connections=100
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_duration_statement=1000

  # ==========================================================================
  # Redis - Cache (Secured)
  # ==========================================================================
  redis:
    # Pin image with SHA256 digest
    image: redis@sha256:b1e2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2
    container_name: aura-redis
    restart: on-failure:3

    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 128m

    secrets:
      - redis_password

    # Security: Read password from secret file
    command: |
      sh -c '
        export REDIS_PASSWORD=$$(cat /run/secrets/redis_password)
        redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes \
          --appendfsync everysec \
          --bind 0.0.0.0 \
          --protected-mode yes \
          --maxmemory 1gb \
          --maxmemory-policy allkeys-lru \
          --save 900 1 \
          --save 300 10 \
          --save 60 10000 \
          --tcp-backlog 511 \
          --timeout 300 \
          --tcp-keepalive 300 \
          --loglevel warning \
          --logfile "" \
          --databases 16 \
          --always-show-logo no \
          --stop-writes-on-bgsave-error yes \
          --rdbcompression yes \
          --rdbchecksum yes \
          --dbfilename dump.rdb \
          --dir /data \
          --replica-read-only yes \
          --repl-diskless-sync no \
          --repl-disable-tcp-nodelay no \
          --lazyfree-lazy-eviction no \
          --lazyfree-lazy-expire no \
          --lazyfree-lazy-server-del no
      '

    networks:
      - data

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 512M

    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default

    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

    user: "999:999"  # redis user

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Nginx - Reverse Proxy with TLS (Secured)
  # ==========================================================================
  nginx:
    # Pin image with SHA256 digest
    image: nginx@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
    container_name: aura-nginx
    restart: on-failure:3

    # Security: Public-facing ports
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
      - nginx-cache:/var/cache/nginx
      - nginx-run:/var/run

    secrets:
      - tls_cert
      - tls_key

    networks:
      - frontend
      - backend

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 256M

    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m,noexec,nosuid,nodev

    user: "101:101"  # nginx user

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      aura-node:
        condition: service_healthy
      grafana:
        condition: service_healthy

    labels:
      - "com.aura.security.level=critical"
      - "com.aura.service.type=reverse-proxy"

# ============================================================================
# VOLUMES - Persistent storage
# ============================================================================
volumes:
  aura-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AURA_DATA_PATH:-./data/aura}

  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROMETHEUS_DATA_PATH:-./data/prometheus}

  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_DATA_PATH:-./data/grafana}

  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-./data/postgres}

  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}

  nginx-cache:
    driver: local

  nginx-run:
    driver: local

# ============================================================================
# SECURITY NOTES
# ============================================================================
# 1. Replace SHA256 digests with actual image digests after verification
# 2. Store secrets in ./secrets/ directory (NEVER commit to version control)
# 3. Use Docker secrets for all credentials
# 4. Review and adjust resource limits based on your infrastructure
# 5. Configure external firewalls to allow only necessary ports
# 6. Enable Docker Content Trust: export DOCKER_CONTENT_TRUST=1
# 7. Scan images regularly: docker scan <image>
# 8. Monitor logs for security events
# 9. Rotate secrets regularly using deployment-security/scripts/rotate-secrets.sh
# 10. Review security contexts and capabilities before deployment
# ============================================================================
