# Pre-commit hooks for code quality and security
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ['--allow-multiple-documents']
        exclude: '^k8s/.*\.yaml$'
      - id: check-json
        name: Check JSON syntax
        exclude: 'tsconfig\.json$'
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # Go formatting and checks
  - repo: local
    hooks:
      - id: go-fmt
        name: Go format
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-vet
        name: Go vet
        entry: bash -c 'cd chain && go vet ./...'
        language: system
        pass_filenames: false

      - id: go-mod-tidy
        name: Go mod tidy
        entry: bash -c 'cd chain && go mod tidy'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: go-test
        name: Go unit tests
        entry: bash -c 'cd chain && go test -short ./...'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # Go linting with golangci-lint (runs from chain directory)
  - repo: local
    hooks:
      - id: golangci-lint
        name: Lint with golangci-lint
        entry: bash -c 'cd chain && golangci-lint run --timeout=5m'
        language: system
        pass_filenames: false
        types: [go]

  # Go security scanning with gosec (exclude generated code)
  - repo: local
    hooks:
      - id: gosec
        name: Security scan with gosec
        entry: bash -c 'cd chain && gosec -exclude=G101,G104,G115,G304,G306,G404,G407 -exclude-dir=../api -exclude-dir=../proto -exclude-dir=../aura ./...'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '.*_test\.go$'

  # Gitleaks - additional secret detection (defense-in-depth)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--disable', 'MD013', 'MD033', 'MD041']

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ['-d', '{extends: relaxed, rules: {line-length: {max: 150}}}']

  # Protobuf linting is handled by CI with proper exceptions
  # Local pre-commit focuses on Go code quality
  # - repo: https://github.com/bufbuild/buf
  #   rev: v1.28.1
  #   hooks:
  #     - id: buf-lint
  #       name: Lint Protobuf files

# Exclude patterns
exclude: |
  (?x)^(
    vendor/|
    \.git/|
    node_modules/|
    third_party/|
    data/
  )$
