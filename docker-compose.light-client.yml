version: "3.8"

services:
  aura-light-client:
    image: cometbft/cometbft:v0.38.17
    container_name: aura-light-client
    entrypoint: ["/bin/sh", "-c"]
    network_mode: host
    env_file:
      - .env.light-client
    restart: unless-stopped
    ports:
      - "${LIGHT_CLIENT_PORT:-8888}:8888"
    volumes:
      - aura-light-client:/cometbft/.light
    command: >
      sh -c '
        set -euo pipefail;
        if [ -z "${TRUST_HEIGHT:-}" ] || [ -z "${TRUST_HASH:-}" ]; then
          echo "TRUST_HEIGHT and TRUST_HASH must be set (see docs/testnet/LIGHT_CLIENT_GUIDE.md)"; exit 1; fi;
        WITNESS_ARG="";
        if [ -n "${WITNESS_RPC:-}" ]; then
          WITNESS_ARG="--witnesses ${WITNESS_RPC}";
        fi;
        cometbft light ${CHAIN_ID:-aura-testnet-1} \
          --primary ${PRIMARY_RPC:-https://rpc.aura-testnet.com} \
          $${WITNESS_ARG} \
          --trust-level ${TRUST_LEVEL:-1/3} \
          --trusting-period ${TRUSTING_PERIOD:-168h0m0s} \
          --height ${TRUST_HEIGHT} \
          --hash ${TRUST_HASH} \
          --home-dir /cometbft/.light \
          --laddr tcp://0.0.0.0:8888
      '
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/status"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  aura-light-client:
    driver: local
