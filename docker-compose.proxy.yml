version: '3.8'

# =============================================================================
# Aura Testnet Public Endpoint Proxy
# =============================================================================
#
# This configuration provides public HTTP/gRPC endpoints for the Aura testnet.
# It proxies requests to validator-1 with rate limiting, CORS support, and
# security headers for browser-based clients.
#
# Prerequisites:
#   - Testnet must be running: docker-compose -f docker-compose.testnet.yml up -d
#   - Validators must be healthy and producing blocks
#
# Usage:
#   1. Start the proxy:
#      docker-compose -f docker-compose.proxy.yml up -d
#
#   2. Access endpoints:
#      - RPC:     http://localhost/rpc
#      - API:     http://localhost/api
#      - gRPC:    localhost:9090 (with gRPC client)
#      - Swagger: http://localhost/api/swagger/
#      - Health:  http://localhost/health
#
#   3. Test RPC endpoint:
#      curl http://localhost/rpc/status | jq
#
#   4. Test API endpoint:
#      curl http://localhost/api/cosmos/base/tendermint/v1beta1/blocks/latest | jq
#
#   5. Test WebSocket (block subscriptions):
#      wscat -c ws://localhost/rpc/websocket
#      {"jsonrpc":"2.0","method":"subscribe","params":["tm.event='NewBlock'"],"id":1}
#
#   6. View logs:
#      docker-compose -f docker-compose.proxy.yml logs -f
#
#   7. Stop the proxy:
#      docker-compose -f docker-compose.proxy.yml down
#
# =============================================================================

services:
  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx-testnet-proxy:
    image: nginx:1.25-alpine
    container_name: aura-testnet-proxy
    hostname: testnet-proxy
    restart: unless-stopped

    # Resource limits
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.5

    # Port mappings
    ports:
      - "80:80"       # HTTP (RPC/API endpoints)
      - "9090:9090"   # gRPC (native gRPC clients)

    # Configuration and logs
    volumes:
      - ./nginx/testnet-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-testnet-logs:/var/log/nginx

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Connect to testnet network to access validators
    networks:
      - aura-testnet

    # Add host.docker.internal for Linux (required to access host-mapped ports)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=nginx-testnet-proxy"

    # Labels for identification
    labels:
      - "aura.role=proxy"
      - "aura.network=testnet"
      - "aura.service=public-endpoints"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  nginx-testnet-logs:
    driver: local
    labels:
      - "aura.service=proxy"
      - "aura.network=testnet"

# =============================================================================
# Networks
# =============================================================================
# Connect to the existing testnet network
networks:
  aura-testnet:
    external: true
    name: aura_aura-testnet
