# Aura Testnet Public RPC Endpoint - Nginx Reverse Proxy Configuration
# This configuration provides SSL/TLS termination, rate limiting, and CORS headers

# Rate limiting zones
# Limit requests per IP to prevent abuse
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=100r/s;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream backend servers
upstream rpc_backend {
    server localhost:26657 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream api_backend {
    server localhost:1317 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream grpc_backend {
    server localhost:9090 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream grpc_web_backend {
    server localhost:9091 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rpc.testnet.aura.network;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server for RPC, API, and metrics
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc.testnet.aura.network;

    # SSL/TLS configuration
    ssl_certificate /etc/nginx/ssl/aura-testnet.crt;
    ssl_certificate_key /etc/nginx/ssl/aura-testnet.key;

    # Modern SSL/TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers (for browser-based clients)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

    # Connection limits
    limit_conn conn_limit 100;

    # Request size limits
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Logging
    access_log /var/log/nginx/rpc-access.log combined;
    error_log /var/log/nginx/rpc-error.log warn;

    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Tendermint RPC endpoints
    location /rpc/ {
        # Rate limiting
        limit_req zone=rpc_limit burst=20 nodelay;

        # Rewrite path
        rewrite ^/rpc/(.*) /$1 break;

        # Proxy configuration
        proxy_pass http://rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_buffering off;
        proxy_cache off;

        # Handle OPTIONS requests for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Cosmos REST API endpoints
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=30 nodelay;

        # Rewrite path
        rewrite ^/api/(.*) /$1 break;

        # Proxy configuration
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caching for certain endpoints
        proxy_cache_valid 200 1s;
        proxy_cache_bypass $http_cache_control;

        # Handle OPTIONS requests for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Prometheus metrics endpoint (restricted access)
    location /metrics {
        # Only allow access from monitoring systems
        # Comment out to enable public access (not recommended)
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        # Proxy to Tendermint metrics
        proxy_pass http://localhost:26660/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger documentation
    location /swagger/ {
        # Rate limiting for documentation
        limit_req zone=api_limit burst=10 nodelay;

        # Proxy to API swagger
        proxy_pass http://api_backend/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root redirects to documentation
    location = / {
        return 302 /swagger/;
    }
}

# gRPC server (separate from HTTPS)
server {
    listen 9090 ssl http2;
    listen [::]:9090 ssl http2;
    server_name rpc.testnet.aura.network;

    # SSL/TLS configuration (same certificates)
    ssl_certificate /etc/nginx/ssl/aura-testnet.crt;
    ssl_certificate_key /etc/nginx/ssl/aura-testnet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Rate limiting for gRPC
    limit_req zone=grpc_limit burst=50 nodelay;
    limit_conn conn_limit 200;

    # Logging
    access_log /var/log/nginx/grpc-access.log combined;
    error_log /var/log/nginx/grpc-error.log warn;

    # gRPC configuration
    location / {
        grpc_pass grpc://grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;

        # Error pages for gRPC
        error_page 502 = /error502grpc;
        default_type application/grpc;
    }

    location = /error502grpc {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;
        add_header grpc-message "unavailable";
        return 204;
    }
}

# gRPC-Web server (for browser clients)
server {
    listen 9091 ssl http2;
    listen [::]:9091 ssl http2;
    server_name rpc.testnet.aura.network;

    # SSL/TLS configuration
    ssl_certificate /etc/nginx/ssl/aura-testnet.crt;
    ssl_certificate_key /etc/nginx/ssl/aura-testnet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # CORS headers for gRPC-Web
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Grpc-Web,X-User-Agent,grpc-timeout" always;
    add_header Access-Control-Expose-Headers "grpc-status,grpc-message,grpc-status-details-bin" always;

    # Rate limiting
    limit_req zone=grpc_limit burst=50 nodelay;
    limit_conn conn_limit 200;

    # Logging
    access_log /var/log/nginx/grpc-web-access.log combined;
    error_log /var/log/nginx/grpc-web-error.log warn;

    # gRPC-Web configuration
    location / {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Grpc-Web,X-User-Agent,grpc-timeout" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        grpc_pass grpc://grpc_web_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
    }
}
