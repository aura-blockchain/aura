# Aura Testnet Public Endpoints - Nginx Reverse Proxy Configuration
# Provides public access to validator-1 RPC, API, and gRPC endpoints
# with CORS support, rate limiting, and security headers

# =============================================================================
# Rate Limiting Zones
# =============================================================================
# Prevent abuse by limiting requests per IP address
limit_req_zone $binary_remote_addr zone=testnet_rpc_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=testnet_api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=testnet_grpc_limit:10m rate=100r/s;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=testnet_conn_limit:10m;

# =============================================================================
# Upstream Backend Servers
# =============================================================================
# Primary backend: validator-1 (can add additional validators for load balancing)
upstream testnet_rpc_backend {
    # Primary observer node handles all RPC traffic
    server aura-observer-1:26657 max_fails=3 fail_timeout=30s weight=10;

    # Backup validators (uncomment additional ones for load balancing)
    server aura-validator-1:26657 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-2:26657 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-3:26657 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-4:26657 max_fails=3 fail_timeout=30s weight=5 backup;

    keepalive 32;
}

upstream testnet_api_backend {
    # REST / gRPC-gateway traffic terminates on the observer
    server aura-observer-1:1317 max_fails=3 fail_timeout=30s weight=10;
    server aura-validator-1:1317 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-2:1317 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-3:1317 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-4:1317 max_fails=3 fail_timeout=30s weight=5 backup;
    keepalive 32;
}

upstream testnet_grpc_backend {
    # gRPC served exclusively by observer node
    server aura-observer-1:9090 max_fails=3 fail_timeout=30s weight=10;
    server aura-validator-1:9090 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-2:9090 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-3:9090 max_fails=3 fail_timeout=30s weight=5 backup;
    # server aura-validator-4:9090 max_fails=3 fail_timeout=30s weight=5 backup;
    keepalive 32;
}

# =============================================================================
# HTTP Server (Port 80)
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost rpc.localhost api.localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers (for browser-based clients)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time,Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range,X-Chain-Id,X-Block-Height" always;

    # Connection limits
    limit_conn testnet_conn_limit 100;

    # Request size limits
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Logging
    access_log /var/log/nginx/testnet-access.log combined;
    error_log /var/log/nginx/testnet-error.log warn;

    # Health check endpoint (no rate limiting, no auth)
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"aura-testnet-proxy","version":"1.0.0"}\n';
        add_header Content-Type application/json;
    }

    # Root endpoint - API information
    location = / {
        return 200 '{"service":"Aura Testnet Public Endpoints","chain_id":"aura-local-4","endpoints":{"rpc":"http://localhost:8080/rpc","api":"http://localhost:8080/api","grpc":"localhost:12091","websocket":"ws://localhost:8080/rpc/websocket"},"docs":"http://localhost:8080/api/swagger/"}\n';
        add_header Content-Type application/json;
    }

    # =============================================================================
    # Tendermint RPC Endpoints
    # =============================================================================
    location /rpc {
        # Rate limiting
        limit_req zone=testnet_rpc_limit burst=20 nodelay;

        # Rewrite /rpc to root path for backend
        rewrite ^/rpc$ / break;
        rewrite ^/rpc/(.*)$ /$1 break;

        # Proxy configuration
        proxy_pass http://testnet_rpc_backend;
        proxy_http_version 1.1;

        # WebSocket support for subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # =============================================================================
    # Cosmos REST API Endpoints
    # =============================================================================
    location /api {
        # Rate limiting
        limit_req zone=testnet_api_limit burst=30 nodelay;

        # Rewrite /api to root path for backend
        rewrite ^/api$ / break;
        rewrite ^/api/(.*)$ /$1 break;

        # Proxy configuration
        proxy_pass http://testnet_api_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caching for read-only endpoints (very short TTL)
        proxy_cache_valid 200 1s;
        proxy_cache_bypass $http_cache_control;

        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Server-Time,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # =============================================================================
    # Prometheus Metrics Endpoint
    # =============================================================================
    location /metrics {
        # Restrict access to private networks only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        # Proxy to validator-1 metrics
        proxy_pass http://aura-observer-1:26660/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # =============================================================================
    # API Documentation (Swagger)
    # =============================================================================
    location /swagger {
        # Rate limiting for documentation
        limit_req zone=testnet_api_limit burst=10 nodelay;

        # Rewrite for swagger
        rewrite ^/swagger$ /swagger/ permanent;
        rewrite ^/swagger/(.*)$ /swagger/$1 break;

        # Proxy to API swagger docs
        proxy_pass http://testnet_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =============================================================================
    # OpenAPI Specification
    # =============================================================================
    location /openapi {
        # Rate limiting
        limit_req zone=testnet_api_limit burst=10 nodelay;

        # Proxy to API OpenAPI spec
        proxy_pass http://testnet_api_backend/openapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# =============================================================================
# gRPC Server (Port 9090)
# =============================================================================
# Note: This requires HTTP/2 support and gRPC clients
server {
    listen 9090 http2;
    listen [::]:9090 http2;
    server_name localhost;

    # Rate limiting for gRPC
    limit_req zone=testnet_grpc_limit burst=50 nodelay;
    limit_conn testnet_conn_limit 200;

    # Logging
    access_log /var/log/nginx/testnet-grpc-access.log combined;
    error_log /var/log/nginx/testnet-grpc-error.log warn;

    # gRPC configuration
    location / {
        grpc_pass grpc://testnet_grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running gRPC streams
        grpc_read_timeout 86400s;
        grpc_send_timeout 86400s;

        # Error handling for gRPC
        error_page 502 = /error502grpc;
        default_type application/grpc;
    }

    location = /error502grpc {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;
        add_header grpc-message "backend unavailable";
        return 204;
    }
}
