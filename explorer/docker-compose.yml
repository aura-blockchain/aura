version: '3.8'

services:
  # AURA Block Explorer
  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-explorer
    ports:
      - "8082:8082"
    environment:
      # AURA Node Configuration
      - NODE_RPC_URL=http://aura-node:26657
      - NODE_API_URL=http://aura-node:1317
      - NODE_GRPC_URL=aura-node:9090

      # Chain Configuration
      - CHAIN_ID=aura-testnet-1
      - DENOM=uaura
      - DENOM_DECIMALS=6

      # Explorer Configuration
      - EXPLORER_PORT=8082
      - EXPLORER_HOST=0.0.0.0
      - EXPLORER_ENV=production
      - DEBUG=false

      # Database Configuration
      - EXPLORER_DB_PATH=/data/explorer.db

      # Cache Configuration
      - CACHE_TTL_SHORT=60
      - CACHE_TTL_MEDIUM=300
      - CACHE_TTL_LONG=600

      # Logging
      - LOG_LEVEL=INFO

      # Security (set strong keys in production!)
      - ADMIN_API_KEY=change-this-in-production
      - REQUIRE_API_KEY=false

      # Rate Limiting
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=60

      # CORS
      - CORS_ORIGINS=*

    volumes:
      - explorer-data:/data

    networks:
      - aura-network

    restart: unless-stopped

    depends_on:
      - aura-node

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8082/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # AURA Node (placeholder - replace with actual node configuration)
  aura-node:
    image: aura-node:latest  # Replace with your actual AURA node image
    container_name: aura-node
    ports:
      - "26657:26657"  # RPC
      - "1317:1317"    # REST API
      - "9090:9090"    # gRPC
      - "26656:26656"  # P2P
    networks:
      - aura-network
    restart: unless-stopped
    # Add your node configuration here

networks:
  aura-network:
    driver: bridge

volumes:
  explorer-data:
    driver: local
