# SonarQube Configuration for aura Project

# Project identification
sonar.projectKey=decristofaroj_aura
sonar.organization=decristofaroj

# Project metadata
sonar.projectName=Aura Blockchain
sonar.projectVersion=0.1.0

# Source code location (multi-language project)
sonar.sources=chain,proto
sonar.tests=chain/testing,tests

# Go specific settings
sonar.go.coverage.reportPaths=chain/coverage.out

# PHP specific settings (if PHP scanner is available)
sonar.php.coverage.reportPaths=coverage.xml

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.pb.go,**/testdata/**,**/archived_**/**,**/.git/**,**/data/**

# Test exclusions
sonar.test.exclusions=**/*_test.go,**/testing/**,**/tests/**

# Additional analysis parameters
sonar.sourceEncoding=UTF-8

# Quality gates
sonar.qualitygate.wait=true

# Language-specific file patterns
sonar.lang.patterns.go=**/*.go
sonar.lang.patterns.php=**/*.php

# Go test coverage format
sonar.go.tests.reportPaths=**/test-report.json
sonar.go.golangci-lint.reportPaths=**/golangci-lint-report.xml
