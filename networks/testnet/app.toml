# Aura Testnet Public RPC Node Application Configuration
# Generated for public RPC endpoint provisioning

#######################################################################
###                           gRPC Configuration                    ###
#######################################################################

[grpc]

# Enable defines if the gRPC server should be enabled.
enable = true

# Address defines the gRPC server address to bind to.
# Listen on all interfaces for public access (will be secured by nginx)
address = "0.0.0.0:9090"

# MaxRecvMsgSize defines the max message size in bytes the server can receive.
# 10MB default - sufficient for most queries
max-recv-msg-size = 10485760

# MaxSendMsgSize defines the max message size in bytes the server can send.
# 10MB default - sufficient for most responses
max-send-msg-size = 10485760

#######################################################################
###                        gRPC Web Configuration                   ###
#######################################################################

[grpc-web]

# Enable defines if the gRPC-web server should be enabled.
# Enable for web client access
enable = true

# Address defines the gRPC-web server address to bind to.
address = "0.0.0.0:9091"

# EnableUnsafeCORS defines if CORS should be enabled (unsafe - use it for development only)
# Enable for testnet, will be secured by nginx in production
enable-unsafe-cors = true

#######################################################################
###                           API Configuration                     ###
#######################################################################

[api]

# Enable defines if the API server should be enabled.
enable = true

# Address defines the API server to listen on.
# Listen on all interfaces for public access (will be secured by nginx)
address = "tcp://0.0.0.0:1317"

# MaxOpenConnections defines the number of maximum open connections.
# Increased for public RPC node to handle more traffic
max-open-connections = 2000

# RPCReadTimeout defines the Tendermint RPC read timeout in seconds
rpc-read-timeout = 10

# RPCWriteTimeout defines the Tendermint RPC write timeout in seconds
rpc-write-timeout = 10

# RPCMaxBodyBytes defines the Tendermint RPC maximum response body size in bytes
# 1MB limit to prevent abuse
rpc-max-body-bytes = 1000000

# EnableUnsafeCORS defines if CORS should be enabled (unsafe - use it for development only)
# Enable for testnet, will be secured by nginx in production
enabled-unsafe-cors = true

# SwaggerEnabled defines if swagger documentation should be automatically registered.
# Enable for testnet to allow developers to explore the API
swagger = true

#######################################################################
###                           Rosetta Configuration                 ###
#######################################################################

[rosetta]

# Enable defines if the Rosetta API server should be enabled.
enable = false

# Address defines the Rosetta API server to listen on.
address = ":8080"

# Network defines the name of the blockchain network
blockchain = "aura"

# Network defines the name of the network
network = "testnet"

# Retries defines the number of retries when connecting to the node before failing.
retries = 3

# Offline defines if Rosetta server should run in offline mode.
offline = false

#######################################################################
###                       Logging Configuration                     ###
#######################################################################

[logging]

# Level defines the logging level
# Options: trace, debug, info, warn, error, fatal, panic
# Use info for public RPC nodes to balance observability and performance
level = "info"

# Format defines the logging format
# Options: json, plain
# Use json for better log aggregation and analysis
format = "json"

#######################################################################
###                     State Sync Configuration                    ###
#######################################################################

[state-sync]

# Enable state sync snapshots
# Enable for public RPC nodes to serve snapshots to other nodes
snapshot-interval = 1000

# Number of recent snapshots to keep
snapshot-keep-recent = 5

#######################################################################
###                       Telemetry Configuration                   ###
#######################################################################

[telemetry]

# Prefixed with keys to separate services.
service-name = "aura-testnet-rpc"

# Enabled enables the application telemetry functionality. When enabled,
# an in-memory sink is also enabled by default. Operators may also enabled
# other sinks such as Prometheus.
enabled = true

# Enable prefixing gauge values with hostname.
enable-hostname = true

# Enable adding hostname to labels.
enable-hostname-label = true

# Enable adding service to labels.
enable-service-label = true

# PrometheusRetentionTime, when positive, enables a Prometheus metrics sink.
# It defines the retention time in seconds for the Prometheus metrics.
prometheus-retention-time = 60

# GlobalLabels defines a global set of name/value label tuples applied to all
# metrics emitted using the wrapper functions defined in telemetry package.
global-labels = [
  ["chain_id", "aura-testnet-1"],
  ["node_type", "rpc"],
]

#######################################################################
###                     Store Configuration                         ###
#######################################################################

[store]

# The type of pruning to perform
# Options: "default" | "nothing" | "everything" | "custom"
# Use "default" for RPC nodes to balance disk usage and query capability
# This keeps recent blocks while pruning older ones
pruning = "default"

# These are applied when pruning = "custom"
# Keep last 100,000 states (~7 days at 6s block time)
pruning-keep-recent = 100000

# Prune every 10 blocks
pruning-interval = 10

#######################################################################
###                    Mempool Configuration                        ###
#######################################################################

[mempool]

# Setting max-txs to 0 will allow for a unbounded amount of transactions in the mempool.
# Setting max-txs to negative 1 (-1) will disable transactions from being inserted into the mempool.
# Setting max-txs to a positive number (> 0) will limit the number of transactions in the mempool.
# For public RPC nodes, limit mempool size to prevent abuse
max-txs = 5000

#######################################################################
###                    WASM Configuration                           ###
#######################################################################

[wasm]

# Enable WASM smart contracts
enabled = true

# Maximum size of WASM bytecode (bytes)
# 614400 bytes = 600KB (standard limit for production)
max_wasm_code_size = 614400

# Code upload access control
# Options: "nobody" | "everybody" | "any_of_addresses"
# For public RPC nodes, set to "nobody" as uploads should go through validators
code_upload_access = "nobody"

# Maximum gas for query operations
# Queries should be fast and cheap to prevent node resource abuse
query_gas_limit = 3000000

# Simulation gas limit (for gas estimation)
# Used by clients to estimate transaction costs
simulation_gas_limit = 20000000

# Memory cache size (MB)
# Caches compiled WASM modules for faster execution
# 256 MB is balanced for most deployments
memory_cache_size = 256

# Instance cache size (number of contract instances)
# Caches contract instances for repeated execution
instance_cache_size = 50

# Maximum gas for store code operations
max_gas_store_code = 20000000

# Maximum gas for instantiate operations
max_gas_instantiate = 10000000

# Maximum gas for execute operations
max_gas_execute = 15000000

# Maximum gas for migrate operations
max_gas_migrate = 10000000

# Maximum gas for admin operations
max_gas_admin = 1000000

#######################################################################
###                       Module Configuration                      ###
#######################################################################

[modules]

# AURA consolidated modules - enabled by default

# Consolidated security module (network, validator, wallet, incident, crypto, privacy)
[modules.security]
enabled = true

# Consolidated identity module (auth, identitychange)
[modules.identity]
enabled = true

# Consolidated economics module (economicsecurity, governance)
[modules.economics]
enabled = true

# Core AURA modules
[modules.vcregistry]
enabled = true

[modules.inclusionroutines]
enabled = true

[modules.confidencescore]
enabled = true

[modules.dex]
enabled = true

[modules.bridge]
enabled = true

[modules.compliance]
enabled = true

# CosmWasm module
[modules.wasm]
enabled = true
