version: '3.8'

# =============================================================================
# Aura Observer / RPC Node Stack
# =============================================================================
# Runs a non-validator full node dedicated to serving RPC, REST, and gRPC
# traffic for wallets, explorers, and relayers. This stack connects to the
# existing aura_aura-testnet Docker network so it can peer with the local
# validators without exposing them directly to clients.
# =============================================================================

services:
  observer-1:
    image: aurad:latest
    container_name: aura-observer-1
    hostname: observer-1
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 8g
    ports:
      - "28656:26656"  # P2P
      - "28657:26657"  # Tendermint RPC
      - "2318:1317"    # REST API
      - "12090:9090"   # gRPC
      - "28660:26660"  # Prometheus metrics
    volumes:
      - ./testnet-data/observer-1:/home/aura/.aura
    environment:
      - CHAIN_ID=aura-local-4
      - MONIKER=observer-1
      - LOG_LEVEL=info
      - MINIMUM_GAS_PRICES=0.025uaura
      - ENABLE_UNSAFE_CORS=true
      - GODEBUG=randseed=1
    networks:
      aura-testnet:
        ipv4_address: 172.26.0.50
        aliases:
          - observer-1.lab
    healthcheck:
      test: ["CMD", "aurad", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "aura.role=observer"
      - "aura.network=testnet"
      - "aura.service=rpc"

networks:
  aura-testnet:
    external: true
    name: aura_aura-testnet
