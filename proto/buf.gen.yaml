version: v1
plugins:
  - name: gogo
    out: .
    opt:
      - plugins=grpc
      - Mgoogle/protobuf/any.proto=github.com/cosmos/cosmos-sdk/codec/types
      - Mgoogle/protobuf/timestamp.proto=github.com/cosmos/gogoproto/types
      - Mgoogle/protobuf/duration.proto=github.com/cosmos/gogoproto/types
      - Mcosmos/base/v1beta1/coin.proto=github.com/cosmos/cosmos-sdk/types
      - Mcosmos/base/query/v1beta1/pagination.proto=github.com/cosmos/cosmos-sdk/types/query
      - paths=source_relative
  # grpc-gateway temporarily disabled due to gogoproto compatibility issues
  # The standard grpc-gateway plugin expects google.golang.org/protobuf types
  # but we use github.com/cosmos/gogoproto types.
  # TODO: Either use grpc-gateway-gogo plugin or configure properly for gogoproto
  # - name: grpc-gateway
  #   out: .
  #   opt:
  #     - paths=source_relative
  #     - logtostderr=true
