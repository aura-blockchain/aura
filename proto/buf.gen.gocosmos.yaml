# Legacy gocosmos/gogoproto generation for backwards compatibility
# This file generates the traditional gogoproto types used by the chain runtime
version: v1
plugins:
  - name: gocosmos
    out: ..
    opt:
      - plugins=grpc
      - Mgoogle/protobuf/any.proto=github.com/cosmos/cosmos-sdk/codec/types
      - Mgoogle/protobuf/timestamp.proto=github.com/cosmos/gogoproto/types
      - Mgoogle/protobuf/duration.proto=github.com/cosmos/gogoproto/types
      - Mcosmos/base/v1beta1/coin.proto=github.com/cosmos/cosmos-sdk/types
      - Mcosmos/base/query/v1beta1/pagination.proto=github.com/cosmos/cosmos-sdk/types/query
  - name: grpc-gateway
    out: ..
    opt:
      - logtostderr=true
      - allow_colon_final_segments=true
