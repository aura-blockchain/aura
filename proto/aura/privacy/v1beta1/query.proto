syntax = "proto3";

package aura.privacy.v1beta1;

import "aura/privacy/v1beta1/privacy.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/aequitas/aura/proto/aura/privacy/v1beta1";

// Query defines the gRPC querier service for privacy module
service Query {
  // Params queries the module parameters
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  // MixingPool queries a specific mixing pool
  rpc MixingPool(QueryMixingPoolRequest) returns (QueryMixingPoolResponse);

  // MixingPools queries all mixing pools
  rpc MixingPools(QueryMixingPoolsRequest) returns (QueryMixingPoolsResponse);

  // ViewKey queries a specific view key
  rpc ViewKey(QueryViewKeyRequest) returns (QueryViewKeyResponse);

  // ViewKeys queries all view keys for an address
  rpc ViewKeys(QueryViewKeysRequest) returns (QueryViewKeysResponse);

  // VerifyZKProof verifies a zero-knowledge proof
  rpc VerifyZKProof(QueryVerifyZKProofRequest) returns (QueryVerifyZKProofResponse);

  // SECURITY NOTE: DecryptWithViewKey has been removed. Decryption must be performed
  // client-side using private keys that never leave the client. The blockchain should
  // never receive or process private keys in any form.
}

// QueryParamsRequest is the request type for the Query/Params RPC method
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method
message QueryParamsResponse {
  // params are the module parameters
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryMixingPoolRequest is the request for a specific mixing pool
message QueryMixingPoolRequest {
  // pool_id is the unique identifier of the pool
  string pool_id = 1;
}

// QueryMixingPoolResponse is the response
message QueryMixingPoolResponse {
  // mixing_pool is the requested pool
  MixingPool mixing_pool = 1;
}

// QueryMixingPoolsRequest is the request for all mixing pools
message QueryMixingPoolsRequest {
  // status filters pools by status (optional)
  string status = 1;
  // pagination defines optional pagination parameters
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryMixingPoolsResponse is the response
message QueryMixingPoolsResponse {
  // mixing_pools are all matching pools
  repeated MixingPool mixing_pools = 1;
  // pagination defines the pagination response
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryViewKeyRequest is the request for a specific view key
message QueryViewKeyRequest {
  // public_view_key is the key to query
  bytes public_view_key = 1;
}

// QueryViewKeyResponse is the response
message QueryViewKeyResponse {
  // view_key is the requested key (without private component)
  ViewKey view_key = 1;
}

// QueryViewKeysRequest is the request for all view keys of an address
message QueryViewKeysRequest {
  // address is the address to query
  string address = 1;
  // pagination defines optional pagination parameters
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryViewKeysResponse is the response
message QueryViewKeysResponse {
  // view_keys are all keys for the address
  repeated ViewKey view_keys = 1;
  // pagination defines the pagination response
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryVerifyZKProofRequest is the request to verify a ZK proof
message QueryVerifyZKProofRequest {
  // zk_proof is the proof to verify
  ZKProof zk_proof = 1;
}

// QueryVerifyZKProofResponse is the response
message QueryVerifyZKProofResponse {
  // valid indicates if the proof is valid
  bool valid = 1;

  // error_message contains details if verification failed
  string error_message = 2;
}

// SECURITY NOTE: QueryDecryptWithViewKey messages have been removed.
// Decryption is a client-side operation that must never involve the blockchain.
// Private keys must never be transmitted to or processed by the chain.
// Clients should:
// 1. Download encrypted transaction data from the chain
// 2. Decrypt locally using their private view keys (kept client-side)
// 3. Never send private keys to the blockchain
