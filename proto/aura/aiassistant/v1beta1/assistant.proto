syntax = "proto3";
package aura.aiassistant.v1beta1;

import "google/protobuf/timestamp.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/aequitas/aura/proto/aura/aiassistant/v1beta1";

enum AssistantStatus {
  ASSISTANT_STATUS_UNSPECIFIED = 0;
  ASSISTANT_STATUS_ACTIVE = 1;
  ASSISTANT_STATUS_JAILED = 2;
  ASSISTANT_STATUS_TOMBSTONED = 3;
}

message Assistant {
  string assistant_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string owner_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Balance stake = 3 [(gogoproto.nullable) = false];
  Balance sponsorship_balance = 4 [(gogoproto.nullable) = false];
  repeated string locales = 5;
  string model_hash = 6;
  string api_key_fingerprint = 7;
  google.protobuf.Timestamp last_heartbeat = 8 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
  AssistantStatus status = 9;
  uint64 slash_count = 10;
  uint64 misbehavior_reports = 11;
  uint64 heartbeat_failures = 12;
}

message Params {
  Balance min_stake = 1 [(gogoproto.nullable) = false];
  uint64 heartbeat_window_seconds = 2;
  uint64 heartbeat_grace_seconds = 3;
  string slash_fraction_downtime = 4 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];
  string slash_fraction_misbehavior = 5 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];
  uint64 max_locales = 6;
}

message GenesisState {
  repeated Assistant assistants = 1 [(gogoproto.nullable) = false];
  Params params = 2 [(gogoproto.nullable) = false];
}

message Balance {
  string denom = 1;
  string amount = 2 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = false
  ];
}
