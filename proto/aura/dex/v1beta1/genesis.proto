syntax = "proto3";
package aura.dex.v1beta1;

import "gogoproto/gogo.proto";
import "aura/dex/v1beta1/params.proto";
import "aura/dex/v1beta1/liquidity_pool.proto";
import "aura/dex/v1beta1/swap.proto";
import "aura/dex/v1beta1/security.proto";

option go_package = "github.com/aequitas/aura/proto/aura/dex/v1beta1";

// GenesisState defines the dex module's genesis state
message GenesisState {
  // Module parameters
  Params params = 1 [(gogoproto.nullable) = false];

  // Liquidity pools
  repeated LiquidityPool liquidity_pools = 2 [(gogoproto.nullable) = false];

  // Swap orders
  repeated SwapOrder swap_orders = 3 [(gogoproto.nullable) = false];

  // Orderbooks
  repeated Orderbook orderbooks = 4 [(gogoproto.nullable) = false];

  // Market prices
  repeated MarketPrice market_prices = 5 [(gogoproto.nullable) = false];

  // Swap stats
  repeated SwapStats swap_stats = 6 [(gogoproto.nullable) = false];

  // Order commitments (commit-reveal scheme)
  repeated OrderCommitment order_commitments = 7 [(gogoproto.nullable) = false];

  // Queued orders (for batch execution)
  repeated QueuedOrder queued_orders = 8 [(gogoproto.nullable) = false];

  // Pool creation records (audit trail for regulatory compliance)
  repeated PoolCreationRecord pool_creation_records = 9 [(gogoproto.nullable) = false];
}
