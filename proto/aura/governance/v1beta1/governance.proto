syntax = "proto3";
package aura.governance.v1beta1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/aequitas/aura/proto/aura/governance/v1beta1";

// ProposalStatus defines the status of a governance proposal
enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_DEPOSIT_PERIOD = 1;
  PROPOSAL_STATUS_VOTING_PERIOD = 2;
  PROPOSAL_STATUS_PASSED = 3;
  PROPOSAL_STATUS_REJECTED = 4;
  PROPOSAL_STATUS_FAILED = 5;
  PROPOSAL_STATUS_VETOED = 6;
  PROPOSAL_STATUS_EXECUTION_DELAY = 7;
  PROPOSAL_STATUS_READY_FOR_EXECUTION = 8;
  PROPOSAL_STATUS_EXECUTED = 9;
}

// VoteOption defines a vote option
enum VoteOption {
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_ABSTAIN = 2;
  VOTE_OPTION_NO = 3;
  VOTE_OPTION_NO_WITH_VETO = 4;
}

// ProposalCategory defines the category of a proposal with different thresholds
enum ProposalCategory {
  PROPOSAL_CATEGORY_UNSPECIFIED = 0;
  PROPOSAL_CATEGORY_TEXT = 1;              // Simple text proposals
  PROPOSAL_CATEGORY_PARAMETER_CHANGE = 2;  // Parameter changes
  PROPOSAL_CATEGORY_SOFTWARE_UPGRADE = 3;  // Software upgrades
  PROPOSAL_CATEGORY_SPENDING = 4;          // Treasury spending
  PROPOSAL_CATEGORY_EMERGENCY = 5;         // Emergency proposals (fast-track)
  PROPOSAL_CATEGORY_CONSTITUTION = 6;      // Constitution changes (highest threshold)
}

// Proposal defines a governance proposal
message Proposal {
  uint64 id = 1;
  string title = 2;
  string description = 3;
  ProposalCategory category = 4;
  ProposalStatus status = 5;

  // Voting details
  TallyResult final_tally_result = 6;
  google.protobuf.Timestamp submit_time = 7;
  google.protobuf.Timestamp deposit_end_time = 8;
  google.protobuf.Timestamp voting_start_time = 9;
  google.protobuf.Timestamp voting_end_time = 10;
  google.protobuf.Timestamp execution_time = 11;

  // Deposit tracking
  repeated Deposit deposits = 12;
  string total_deposit = 13;

  // Proposer
  string proposer = 14;

  // Execution delay (time-lock)
  google.protobuf.Duration execution_delay = 15;

  // Emergency flag for fast-track
  bool is_emergency = 16;

  // Snapshot block height for snapshot voting
  uint64 snapshot_height = 17;

  // Rejection reason (if status is REJECTED or FAILED)
  string rejection_reason = 18;
}

// Deposit represents a deposit made on a proposal
message Deposit {
  uint64 proposal_id = 1;
  string depositor = 2;
  string amount = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Vote represents a vote on a proposal
message Vote {
  uint64 proposal_id = 1;
  string voter = 2;
  VoteOption option = 3;
  google.protobuf.Timestamp timestamp = 4;

  // Secret ballot support
  bool is_secret = 5;
  string encrypted_vote = 6;  // Encrypted vote for secret ballots
  string vote_commitment = 7;  // Commitment hash for secret ballots

  // Voting power at snapshot height
  string voting_power = 8;
}

// TallyResult defines the tally of a proposal vote
message TallyResult {
  string yes = 1;
  string abstain = 2;
  string no = 3;
  string no_with_veto = 4;
  string total_voting_power = 5;
  string turnout_percentage = 6;
}

// VoteDelegation represents delegation of voting power
message VoteDelegation {
  string delegator = 1;
  string delegate = 2;
  google.protobuf.Timestamp delegation_time = 3;
  string delegated_power = 4;

  // Optional: category-specific delegation
  repeated ProposalCategory categories = 5;
}

// TokenLock represents locked tokens during voting
message TokenLock {
  string owner = 1;
  uint64 proposal_id = 2;
  string locked_amount = 3;
  google.protobuf.Timestamp lock_time = 4;
  google.protobuf.Timestamp unlock_time = 5;
}

// VetoRequest represents a veto request for emergency situations
message VetoRequest {
  uint64 proposal_id = 1;
  string vetoer = 2;
  string reason = 3;
  google.protobuf.Timestamp timestamp = 4;
  repeated string cosigners = 5;  // Multi-sig veto support
}

// SnapshotVote represents an off-chain signaling vote
message SnapshotVote {
  uint64 proposal_id = 1;
  uint64 snapshot_height = 2;
  string voter = 3;
  VoteOption option = 4;
  string voting_power_at_snapshot = 5;
  string signature = 6;
  google.protobuf.Timestamp timestamp = 7;
}

// GovernanceParams defines the parameters for the governance module
message GovernanceParams {
  // Deposit parameters
  string min_deposit = 1;
  google.protobuf.Duration max_deposit_period = 2;

  // Voting parameters
  google.protobuf.Duration voting_period = 3;
  string quorum = 4;  // Minimum participation percentage
  string threshold = 5;  // Minimum yes percentage
  string veto_threshold = 6;  // Minimum veto percentage

  // Execution delay (time-lock)
  google.protobuf.Duration execution_delay = 7;

  // Emergency fast-track
  google.protobuf.Duration emergency_voting_period = 8;
  string emergency_quorum = 9;
  string emergency_threshold = 10;

  // Category-specific thresholds
  map<string, CategoryParams> category_params = 11;

  // Veto parameters
  uint32 veto_cosigners_required = 12;
  repeated string veto_authorized_addresses = 13;

  // Token lock parameters
  bool require_token_lock = 14;
  google.protobuf.Duration token_lock_duration = 15;

  // Snapshot voting
  bool snapshot_voting_enabled = 16;
  uint64 snapshot_lookback_blocks = 17;

  // Secret ballot
  bool secret_ballot_enabled = 18;
  google.protobuf.Duration reveal_period = 19;
}

// CategoryParams defines category-specific governance parameters
message CategoryParams {
  string min_deposit = 1;
  google.protobuf.Duration voting_period = 2;
  string quorum = 3;
  string threshold = 4;
  string veto_threshold = 5;
  google.protobuf.Duration execution_delay = 6;
}
