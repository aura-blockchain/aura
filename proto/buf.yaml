version: v1beta1
name: buf.build/aura-blockchain/aura
build:
  roots:
    - .
deps:
  - buf.build/cosmos/cosmos-sdk
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
  - buf.build/protocolbuffers/wellknowntypes
lint:
  use:
    - DEFAULT
  except:
    # Cosmos SDK uses Msg/Query service names without Service suffix
    - SERVICE_SUFFIX
    # Cosmos SDK uses MsgXxx for RPC request types
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # Allow non-standard RPC naming for Cosmos SDK compatibility
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
