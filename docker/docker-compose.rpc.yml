version: '3.8'

services:
  # Aura RPC Node
  aura-rpc-node:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: aura-rpc-node
    hostname: aura-rpc-node
    restart: unless-stopped

    environment:
      - AURA_HOME=/root/.aura
      - AURA_CHAIN_ID=aura-mvp-1
      - LOG_LEVEL=info
      - LOG_FORMAT=json

    ports:
      # Internal ports (accessed via nginx)
      - "26657:26657"  # Tendermint RPC
      - "1317:1317"    # Cosmos REST API
      - "9090:9090"    # gRPC
      - "9091:9091"    # gRPC-Web
      - "26656:26656"  # P2P
      - "26660:26660"  # Prometheus metrics

    volumes:
      - aura-rpc-data:/root/.aura
      - ../networks/testnet/config.toml:/root/.aura/config/config.toml:ro
      - ../networks/testnet/app.toml:/root/.aura/config/app.toml:ro
      - ./init-rpc-node.sh:/docker-entrypoint-initdb.d/init-rpc-node.sh:ro

    command:
      - start
      - --home=/root/.aura
      - --pruning=default
      - --rpc.laddr=tcp://0.0.0.0:26657
      - --api.enable=true
      - --api.address=tcp://0.0.0.0:1317
      - --grpc.enable=true
      - --grpc.address=0.0.0.0:9090

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - aura-network

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=aura-rpc-node"

  # Nginx Reverse Proxy with SSL/TLS
  nginx-rpc-proxy:
    image: nginx:1.25-alpine
    container_name: aura-nginx-proxy
    hostname: nginx-proxy
    restart: unless-stopped

    depends_on:
      - aura-rpc-node

    ports:
      - "80:80"      # HTTP (redirects to HTTPS)
      - "443:443"    # HTTPS (RPC/API)
      - "9443:9090"  # gRPC over TLS
      - "9444:9091"  # gRPC-Web over TLS

    volumes:
      - ../nginx/rpc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - aura-network

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=nginx-proxy"

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: aura-prometheus
    hostname: prometheus
    restart: unless-stopped

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

    ports:
      - "9092:9090"  # Prometheus UI (different port to avoid conflict with gRPC)

    volumes:
      - ./prometheus-rpc.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - aura-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: aura-grafana
    hostname: grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel

    ports:
      - "3001:3000"  # Grafana UI

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

    networks:
      - aura-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: aura-node-exporter
    hostname: node-exporter
    restart: unless-stopped

    command:
      - '--path.rootfs=/host'

    pid: host

    volumes:
      - '/:/host:ro,rslave'

    networks:
      - aura-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aura-rpc-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/rpc-node

  nginx-logs:
    driver: local

  prometheus-data:
    driver: local

  grafana-data:
    driver: local

networks:
  aura-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
