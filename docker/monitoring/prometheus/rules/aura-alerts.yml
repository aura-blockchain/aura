groups:
  - name: aura-blockchain
    rules:
      # Chain halt detection
      - alert: ChainHalted
        expr: increase(cometbft_consensus_height[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AURA blockchain has halted"
          description: "No new blocks have been produced in the last 5 minutes"

      # Block time too high
      - alert: SlowBlockTime
        expr: cometbft_consensus_block_interval_seconds > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Block time is too high"
          description: "Block time is {{ $value }}s (threshold: 10s)"

      # Low peer count
      - alert: LowPeerCount
        expr: cometbft_p2p_peers < 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low peer count"
          description: "Node has only {{ $value }} peers (minimum: 3)"

      # Validator not signing
      - alert: ValidatorNotSigning
        expr: cometbft_consensus_validator_power == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Validator is not signing blocks"
          description: "Validator voting power is 0"

  - name: system-resources
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"

      # Disk space running low
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}% (threshold: 80%)"

  - name: wasm-module
    rules:
      # WASM transaction failure rate
      - alert: WASMTransactionFailureRate
        expr: (rate(aura_wasm_tx_failures_total[5m]) / clamp_min(rate(aura_wasm_tx_total[5m]), 0.0001)) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WASM transaction failure rate exceeds 1%"
          description: "WASM tx failure rate is {{ $value | humanizePercentage }} (threshold: 1%). Contract: {{ $labels.contract_address }}, Error: {{ $labels.error_type }}"
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasmtransactionfailurerate"

      # WASM signature mismatch
      - alert: WASMSignatureMismatch
        expr: rate(aura_bridge_signature_mismatches_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WASM signature verification mismatches detected"
          description: "Signature mismatch rate: {{ $value | humanize }}/sec. Chain: {{ $labels.chain }}, Type: {{ $labels.signature_type }}, Reason: {{ $labels.error_reason }}"
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#signaturemismatchratehigh"

      # WASM contract deployment failure
      - alert: WASMContractDeploymentFailure
        expr: increase(aura_wasm_instantiation_failures_total[10m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WASM contract deployment failures detected"
          description: "{{ $value }} contract instantiation failures in last 10 minutes. Code ID: {{ $labels.code_id }}, Error: {{ $labels.error_type }}"
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasminstantiationfailures"

      # WASM execution timeout
      - alert: WASMExecutionTimeout
        expr: histogram_quantile(0.95, rate(aura_wasm_execution_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WASM contract execution is timing out"
          description: "95th percentile execution time is {{ $value }}s (threshold: 5s). Contract: {{ $labels.contract_address }}. Consider optimizing contract code or increasing gas limits."
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasm-execution-performance"

      # WASM gas exhaustion
      - alert: WASMGasExhaustion
        expr: rate(aura_wasm_tx_failures_total{error_type="out_of_gas"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of WASM gas exhaustion errors"
          description: "Out-of-gas errors: {{ $value | humanize }}/sec. Contract: {{ $labels.contract_address }}. Users may need higher gas limits or contract code needs optimization."
          runbook_url: "https://github.com/decristofaroj/aura/blob/main/docs/monitoring/wasm-bridge-security-monitoring.md#wasmoutofgasspike"
